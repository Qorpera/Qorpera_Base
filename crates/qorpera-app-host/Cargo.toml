[package]
name = "qorpera-app-host"
version = "0.1.0"
edition = "2021"
publish = false
description = "Production full-stack app lifecycle daemon for Qorpera hosted apps: isolated LXD containers, zero-downtime blue/green deploys, scale-to-zero wake/hibernation, and live log capture."
license = "MIT"

[dependencies]
bytes = "1.10"
http = "1.3"
http-body-util = "0.1"
hyper = { version = "1.6", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
subtle = "2.6"
tokio = { version = "1.45", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
