[package]
name = "qorpera-folder"
version = "0.1.0"
edition = "2021"
publish = false
description = "The company folder inside a Qorpera machine (FUSE mount) and the node's vsock bridge to the folder service."
license = "MIT"

[dependencies]
fuser = { version = "0.18", default-features = false }
libc = "0.2"
memchr = "=2.8.3"
regex-automata = { version = "=0.4.19", default-features = false, features = ["std", "alloc", "meta", "hybrid", "nfa-pikevm", "nfa-backtrack", "nfa-thompson", "perf-literal-substring", "perf-literal-multisubstring", "perf-inline"] }
regex-syntax = { version = "=0.8.12", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
vsock = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
