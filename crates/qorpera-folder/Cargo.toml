[package]
name = "qorpera-folder"
version = "0.1.0"
edition = "2021"
publish = false
description = "The company folder inside a Qorpera machine (FUSE mount) and the node's vsock bridge to the folder service."
license = "MIT"

[dependencies]
fuser = { version = "0.18", default-features = false }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vsock = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
