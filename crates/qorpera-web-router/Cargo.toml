[package]
name = "qorpera-web-router"
version = "0.1.0"
edition = "2021"
publish = false
description = "Native edge HTTP/WebSocket router, content-addressed static blob server, and Caddy On-Demand TLS verifier for Qorpera hosted websites and apps."
license = "MIT"

[dependencies]
arc-swap = "1.7"
brotli = "8"
bytes = "1.10"
flate2 = "1.1"
hex = "0.4"
http = "1.3"
http-body-util = "0.1"
hyper = { version = "1.6", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
tokio = { version = "1.45", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
tokio-postgres-rustls = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
webpki-roots = "0.26"
zstd = "0.13"

[dev-dependencies]
tempfile = "3.20"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
