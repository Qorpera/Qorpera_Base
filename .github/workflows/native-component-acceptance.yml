name: Pinned native source component acceptance

on:
  workflow_call:

permissions:
  contents: read

jobs:
  native-component:
    name: Serial native dev build and 20 offline component tests
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install reviewed test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate component evidence and process deadlines
        run: node --test scripts/acceptance/native-component.test.mjs
      - name: Install native compilation prerequisites
        timeout-minutes: 10
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT}" = github-hosted
          test "$(uname -m)" = x86_64
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libssl-dev libcap-dev libasound2-dev cmake time
          node_binary="$(readlink -f "$(command -v node)")"
          chmod go-w "$node_binary" || sudo chmod go-w "$node_binary"
      - name: Install the reviewed Rust toolchain
        # This version-specific action hardcodes 1.95.0 and has no toolchain input.
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - name: Checkout the pinned upstream source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openai/codex
          ref: be2951ea34f0d295ed0becf97079f92fa5f6950e
          path: .native-component-upstream
          persist-credentials: false
      - name: Build serially and exercise the actual native process
        timeout-minutes: 175
        env:
          RUSTUP_HOME: /home/runner/.rustup
        run: >-
          node scripts/acceptance/native-component.mjs
          --source "${GITHUB_WORKSPACE}/.native-component-upstream"
          --out "${RUNNER_TEMP}/native-component-acceptance"
      - name: Retain bounded component evidence and build failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-component-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-component-acceptance/evidence.json
            ${{ runner.temp }}/native-component-acceptance/*.log
            ${{ runner.temp }}/native-component-acceptance/*.json
            ${{ runner.temp }}/native-component-acceptance/build/artifact.json
            ${{ runner.temp }}/native-component-acceptance/build/prepared.json
            ${{ runner.temp }}/native-component-acceptance/v8/*.sha256
          if-no-files-found: warn
          retention-days: 14
      - name: Retain the exact tested component executable privately
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-component-binary-${{ github.sha }}-${{ github.run_attempt }}
          # These four physical files are hashed again after all 20 tests pass.
          # Never include source, target, Cargo/Rust homes, caches or test configuration.
          path: |
            ${{ runner.temp }}/native-component-acceptance/build/codex
            ${{ runner.temp }}/native-component-acceptance/build/artifact.json
            ${{ runner.temp }}/native-component-acceptance/build/LICENSE
            ${{ runner.temp }}/native-component-acceptance/build/NOTICE
          if-no-files-found: error
          retention-days: 14
