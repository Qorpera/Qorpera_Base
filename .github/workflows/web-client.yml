name: Web client

# Builds packages/web (the pure cloud client) and publishes it to Cloudflare
# Pages as app.qorpera.com. The check steps run on every push and pull request
# that touches the package; the deploy step runs only on pushes to the listed
# branches and only when the Cloudflare secrets exist, so a fork or a fresh
# clone still proves the build. One-time setup outside this file: a Pages
# project named `qorpera-web` with the custom domain app.qorpera.com, and the
# repository secrets CLOUDFLARE_API_TOKEN (Pages: Edit) and
# CLOUDFLARE_ACCOUNT_ID. See packages/web/DECISIONS.md (2026-09-02).

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - web/client-app
    paths:
      - '.github/workflows/web-client.yml'
      - 'packages/web/**'
      - 'packages/shell/userland/tokens.css'
      - 'packages/shell/userland/fonts/**'
      - 'packages/shell/userland/staff-creatures/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - '.github/workflows/web-client.yml'
      - 'packages/web/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: web-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Check, build, deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck --workspace packages/web

      - name: Unit tests
        run: npm test --workspace packages/web

      - name: Lint
        run: npx biome check packages/web/src packages/web/test

      - name: Build
        run: npm run build --workspace packages/web

      - name: Publish to Cloudflare Pages
        if: github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: >-
          npx --yes wrangler@4.127.1 pages deploy packages/web/dist
          --project-name qorpera-web
          --branch "${{ github.ref_name }}"
          --commit-hash "${{ github.sha }}"
          --commit-dirty=false

      - name: Deploy skipped
        if: github.event_name != 'pull_request' && (env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '')
        run: echo "Cloudflare Pages secrets are not configured; build verified, deploy skipped."
