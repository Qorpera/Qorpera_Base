name: Web client

# Checks packages/web (the pure cloud client) on every push and pull request
# that touches it: install without lifecycle scripts, typecheck, unit tests,
# lint, build. Deployment is not done here: the Cloudflare Pages project
# `qorpera-web` is connected to this repository through Cloudflare's Git
# integration and builds `packages/web` itself on every push to its production
# branch (web/client-app until the branch merges to master), publishing to
# https://qorpera-web.pages.dev and, once the domain is attached,
# https://app.qorpera.com. See packages/web/DECISIONS.md (2026-09-02).

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - web/client-app
    paths:
      - '.github/workflows/web-client.yml'
      - 'packages/web/**'
      - 'packages/shell/userland/tokens.css'
      - 'packages/shell/userland/fonts/**'
      - 'packages/shell/userland/staff-creatures/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - '.github/workflows/web-client.yml'
      - 'packages/web/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: web-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Check and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck --workspace packages/web

      - name: Unit tests
        run: npm test --workspace packages/web

      - name: Lint
        run: npx biome check packages/web/src packages/web/test

      - name: Build
        run: npm run build --workspace packages/web
