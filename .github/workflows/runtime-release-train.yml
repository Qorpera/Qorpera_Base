name: Runtime release train

# Every PR except a web-only one: under the release train a runtime-only feature
# PR changes no derived file, so it may match no other workflow's paths. This
# workflow still packages the runtime and guards the release-owned files on
# every such PR. A PR that changes only web client files (the web and member-web
# packages, outside what the runtime and cloud-client tests read: the web's cloud
# client and the tsconfig it compiles under, its avatar scripts and member-web's
# screen viewer) cannot touch a
# release-owned file or a runtime test, so it does not start this workflow.
on:
  workflow_dispatch:
  push:
    branches: [master, 'release/runtime-*']
  pull_request:
    # edited fires when the base branch changes, so a stacked PR re-runs the
    # guard against its new base. It also fires on a title or description edit;
    # the jobs skip those (see concurrency and the jobs' if).
    types: [opened, synchronize, reopened, edited]
    paths:
      - '**'
      - '!packages/web/**'
      - 'packages/web/src/cloud/**'
      - 'packages/web/tsconfig.json'
      - 'packages/web/public/assets/avatars/**'
      - '!packages/member-web/**'
      - 'packages/member-web/ui/**'

# Release train (deploy/first-node/RUNTIME-RELEASE-TRAIN.md): only release
# branches declare the runtime bundle, so only they must carry derived files
# that match the source. Everywhere else the freshness asserts are skipped.
env:
  QORPERA_ENFORCE_RUNTIME_BUNDLE: ${{ ((github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/runtime-')) || (github.event_name == 'push' && startsWith(github.ref_name, 'release/runtime-'))) && '1' || '0' }}

permissions:
  contents: read

# A title or description edit gets a group of its own, so its skipped run never
# cancels a real run of the same PR.
concurrency:
  group: runtime-release-train-${{ github.ref }}${{ github.event.action == 'edited' && !github.event.changes.base && '-edit' || '' }}
  cancel-in-progress: true

jobs:
  train:
    # The name comes from a one-entry matrix on purpose: a job skipped by its if
    # keeps the unexpanded name, so a skipped edit run never shares a check name
    # with (and in gh pr checks never shadows) this job's real result. The unit
    # job's matrix name works the same way.
    name: Runtime bundle and ${{ matrix.part }}
    # An edited PR runs again only when its base branch changed.
    if: github.event.action != 'edited' || github.event.changes.base
    strategy:
      matrix:
        part: [release-owned files]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On a pull request: the merge commit and its base parent.
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Feature PRs leave release-owned runtime bundle files alone
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/runtime-')
        run: |
          git rev-parse --verify --quiet 'HEAD^2' >/dev/null || { echo "::error::Expected the pull request merge commit"; exit 1; }
          node scripts/check-release-train-derived-files.mjs 'HEAD^1' HEAD

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Runtime bundle check (strict on release branches only)
        run: npm run check:runtime-bundle:release-train

      # The observation vocabulary check reads migration and TypeScript source
      # only (no database, no network): a name on one side only is dropped live.
      - name: Packaged host pins, ephemeral runner package, the guard and the observation vocabulary
        run: >-
          node --test
          scripts/generate-cloud-runtime-bundle.test.mjs
          scripts/package-ephemeral-runner.test.mjs
          scripts/check-release-train-derived-files.test.mjs
          scripts/check-runtime-observation-vocabulary.test.mjs

  # A runtime change no longer regenerates the bundle, so it may match no
  # path-filtered workflow. This job runs every unit test file of
  # packages/runtime and packages/cloud-client on every run, sharded across
  # runners. New test files join automatically.
  #
  # Tests that need podman, a source-built Codex binary or Windows skip
  # themselves when their environment is absent. Excluded here:
  # - runtime test/cloud-coding-command-guest.test.ts: its fixtures chown each
  #   command log to a coding group the test user holds (gid >= 1000). It runs
  #   in its own step below, under such a group as in the Step 2 LXD workflow.
  unit:
    name: Unit tests (${{ matrix.suite }} ${{ matrix.shard }})
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: runtime, shard: 1/5, supervisor: true }
          - { suite: runtime, shard: 2/5 }
          - { suite: runtime, shard: 3/5 }
          - { suite: runtime, shard: 4/5 }
          - { suite: runtime, shard: 5/5 }
          - { suite: cloud-client, shard: 1/1 }
    env:
      TMPDIR: /tmp
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Tests use this Node binary as the native boundary artifact, and the
      # boundary refuses a group- or world-writable executable.
      - name: Make the Node binary writable by its owner only
        run: |
          node_binary="$(node -p 'require("node:fs").realpathSync(process.execPath)')"
          ls -l "$node_binary"
          chmod go-w "$node_binary" || sudo chmod go-w "$node_binary"
          ls -l "$node_binary"

      # Two office probes run a real Linux container from a cached image with
      # --pull=never --network none.
      - name: Cache the office probe container image
        if: matrix.suite == 'runtime'
        run: docker pull --quiet node:22-bookworm-slim

      - name: Unit tests
        working-directory: packages/${{ matrix.suite }}
        run: >-
          node ../../node_modules/vitest/dist/cli.js --run
          --shard=${{ matrix.shard }}
          --exclude test/cloud-coding-command-guest.test.ts

      - name: Coding command supervisor
        if: ${{ !cancelled() && matrix.supervisor }}
        working-directory: packages/runtime
        run: |
          supervisor="node ../../node_modules/vitest/dist/cli.js --run test/cloud-coding-command-guest.test.ts"
          if [ "$(id -g)" -ge 1000 ]; then
            $supervisor
          else
            sudo groupadd qorpera-coding-test
            sudo usermod -aG qorpera-coding-test "$(id -un)"
            sg qorpera-coding-test -c "$supervisor"
          fi
