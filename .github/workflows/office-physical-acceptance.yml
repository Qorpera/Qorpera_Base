name: Docker-free office acceptance

on:
  workflow_dispatch:
    inputs:
      office_lifecycle_only:
        description: Run only the office lifecycle acceptance
        type: boolean
        required: false
        default: false
      regression_only:
        description: Run only the full isolated Linux regression suite
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      office_lifecycle_only:
        type: boolean
        required: false
        default: false
      regression_only:
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# This manual acceptance executes candidate source against the committed
# release identity; production bundle freshness belongs to the release cut.
env:
  QORPERA_ENFORCE_RUNTIME_BUNDLE: '0'

concurrency:
  group: office-physical-acceptance-${{ github.ref }}-${{ inputs.regression_only && 'regression' || inputs.office_lifecycle_only && 'lifecycle' || 'all' }}
  cancel-in-progress: false

jobs:
  regression:
    if: ${{ inputs.regression_only || !inputs.office_lifecycle_only }}
    name: Full isolated Linux regression suite
    runs-on: ubuntu-24.04
    # The complete workspace includes durable journal and stop/recovery tests;
    # two-worker disk isolation takes longer than the former partial run.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install reviewed dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install native test prerequisites and protect the fixture executable
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes bubblewrap ripgrep python3
          node_binary="$(node -p 'require("node:fs").realpathSync(process.execPath)')"
          chmod go-w "$node_binary" || sudo chmod go-w "$node_binary"
          /usr/bin/bwrap --version
          rg --version
      - name: Hydrate generated model data required by a fresh checkout
        run: npm run hydrate:model-data
      - name: Verify actual unprivileged Git containment
        working-directory: packages/runner-orchestrator
        run: node ../../node_modules/vitest/dist/cli.js --run --maxWorkers=1 --no-cache test/coding-git-sandbox.test.ts
      - name: Check candidate source and browser build
        run: npm run check
      - name: Run all non-e2e tests with isolated credentials and a guest-compatible group
        env:
          TMPDIR: ${{ runner.temp }}
          QORPERA_LINUX_ROOT_PROBES: '1'
        run: |
          set -euo pipefail
          # Coding supervisor fixtures exercise real chown to an admitted
          # guest UID/GID. Use a normal group held by the unprivileged runner.
          if [ "$(id -g)" -ge 1000 ]; then
            VITEST_MAX_WORKERS=2 ./test.sh
          else
            sudo groupadd qorpera-acceptance-test
            sudo usermod -aG qorpera-acceptance-test "$(id -un)"
            sg qorpera-acceptance-test -c 'VITEST_MAX_WORKERS=2 ./test.sh'
          fi
  guard-storage:
    if: ${{ !inputs.office_lifecycle_only && !inputs.regression_only }}
    name: Physical guard disk exhaustion and archive recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Require disposable Linux host
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT}" = github-hosted
          test "$(uname -m)" = x86_64
          test "$(cat /proc/1/comm)" = systemd
          test -c /dev/kvm
          sudo -n python3 scripts/acceptance/paid-lxd-kvm.py
      - name: Install reviewed dependencies and filesystem tools
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          sudo apt-get update
          sudo apt-get install --yes e2fsprogs util-linux
      - name: Install the reviewed LXD revision
        timeout-minutes: 8
        run: |
          set -euo pipefail
          if ! command -v snap >/dev/null; then sudo apt-get install --yes snapd; fi
          sudo systemctl start snapd.socket
          sudo snap wait system seed.loaded
          if snap list lxd >/dev/null 2>&1; then
            if [ "$(snap list lxd | awk 'NR==2 {print $3}')" != 40424 ]; then
              sudo snap refresh lxd --channel=6/stable --revision=40424
            fi
          else
            sudo snap install lxd --channel=6/stable --revision=40424
          fi
          test "$(snap list lxd | awk 'NR==2 {print $2 ":" $3}')" = 6.9-ab8fad2:40424
          sudo snap refresh --hold=forever lxd
          sudo /snap/bin/lxd waitready --timeout=60
      - name: Prove physical stop during full journal disk and startup recovery
        timeout-minutes: 20
        run: >-
          sudo env PATH="${PATH}:/snap/bin" GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted GITHUB_SHA="${GITHUB_SHA}"
          node scripts/acceptance/paid-lxd-disk.mjs --out "${RUNNER_TEMP}/guard-storage-acceptance"
      - name: Upload bounded guard storage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guard-storage-docker-free-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/guard-storage-acceptance/evidence.json
            ${{ runner.temp }}/guard-storage-acceptance/guard.log
          if-no-files-found: warn
          retention-days: 14
  founding:
    if: ${{ !inputs.office_lifecycle_only && !inputs.regression_only }}
    name: Two founders through real web client and Supabase Auth
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install reviewed application dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:web-sdk
      - name: Install native PostgreSQL and pinned Auth/browser tools
        timeout-minutes: 8
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc -o "${RUNNER_TEMP}/pgdg.asc"
          test "$(gpg --show-keys --with-colons "${RUNNER_TEMP}/pgdg.asc" | awk -F: '$1=="fpr" {print $10; exit}')" = B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
          sudo install -m 0644 "${RUNNER_TEMP}/pgdg.asc" /usr/share/keyrings/qorpera-acceptance-pgdg.asc
          echo 'deb [signed-by=/usr/share/keyrings/qorpera-acceptance-pgdg.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/qorpera-acceptance-pgdg.list
          sudo apt-get update
          sudo apt-get install --yes postgresql-17 postgresql-client-17
          bash scripts/acceptance/founding-install.sh "${RUNNER_TEMP}/founding-tools"
      - name: Prove multiplayer company creation
        timeout-minutes: 12
        run: >-
          node scripts/acceptance/founding-native.mjs --bin /usr/lib/postgresql/17/bin
          --tools "${RUNNER_TEMP}/founding-tools" --out "${RUNNER_TEMP}/founding-acceptance"
      - name: Upload bounded founding evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: founding-docker-free-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/founding-acceptance/evidence.json
            ${{ runner.temp }}/founding-acceptance/founder-*-ready.png
          if-no-files-found: warn
          retention-days: 14
  prerequisites:
    if: ${{ !inputs.regression_only }}
    name: Paid office lifecycle on native PostgreSQL and LXD
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Require disposable Linux host
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT}" = github-hosted
          test "$(uname -m)" = x86_64
          test "$(cat /proc/1/comm)" = systemd
          test -c /dev/kvm
          sudo -n python3 scripts/acceptance/paid-lxd-kvm.py
          df -h "${RUNNER_TEMP}"

      - name: Install dependencies without npm lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test isolated fixture boundaries
        run: node --test scripts/acceptance/native-postgres.test.mjs scripts/acceptance/office-rpc-server.test.mjs

      - name: Install native PostgreSQL and NFS tools
        timeout-minutes: 8
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc -o "${RUNNER_TEMP}/pgdg.asc"
          test "$(gpg --show-keys --with-colons "${RUNNER_TEMP}/pgdg.asc" | awk -F: '$1=="fpr" {print $10; exit}')" = B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
          sudo install -m 0644 "${RUNNER_TEMP}/pgdg.asc" /usr/share/keyrings/qorpera-acceptance-pgdg.asc
          echo 'deb [signed-by=/usr/share/keyrings/qorpera-acceptance-pgdg.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/qorpera-acceptance-pgdg.list
          sudo apt-get update
          sudo apt-get install --yes postgresql-17 postgresql-client-17 nfs-kernel-server nfs-common
          /usr/lib/postgresql/17/bin/postgres --version
          mkdir -p "${RUNNER_TEMP}/office-acceptance"
          dpkg-query -W postgresql-17 postgresql-client-17 nfs-kernel-server nfs-common > "${RUNNER_TEMP}/office-acceptance/host-packages.txt"

      - name: Exercise every hosted SQL regression without Docker
        timeout-minutes: 8
        run: >-
          node scripts/acceptance/native-postgres.mjs --bin /usr/lib/postgresql/17/bin
          --all-tests
          --out "${RUNNER_TEMP}/office-acceptance/postgres"

      - name: Prove read-only accounting incident detection and resolution
        timeout-minutes: 5
        run: >-
          node scripts/acceptance/accounting-health-native.mjs --bin /usr/lib/postgresql/17/bin
          --out "${RUNNER_TEMP}/office-acceptance/accounting-health"

      - name: Prove concurrent global spending and payment reversal ordering
        timeout-minutes: 5
        run: >-
          node scripts/acceptance/allowance-concurrency.mjs --bin /usr/lib/postgresql/17/bin
          --out "${RUNNER_TEMP}/office-acceptance/concurrency"

      - name: Exercise authenticated TLS RPC against native PostgreSQL
        timeout-minutes: 8
        run: >-
          node scripts/acceptance/office-rpc-native.mjs --bin /usr/lib/postgresql/17/bin
          --out "${RUNNER_TEMP}/office-acceptance/rpc"

      - name: Verify real NFS and journal mount custody
        timeout-minutes: 3
        run: >-
          sudo env PATH="${PATH}:/snap/bin" GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted GITHUB_SHA="${GITHUB_SHA}"
          node scripts/acceptance/office-host-storage.mjs --out "${RUNNER_TEMP}/office-acceptance/storage"

      - name: Install the reviewed LXD revision
        timeout-minutes: 8
        run: |
          set -euo pipefail
          if ! command -v snap >/dev/null; then
            sudo apt-get install --yes snapd
          fi
          sudo systemctl start snapd.socket
          sudo snap wait system seed.loaded
          if snap list lxd >/dev/null 2>&1; then
            if [ "$(snap list lxd | awk 'NR==2 {print $3}')" != 40424 ]; then
              sudo snap refresh lxd --channel=6/stable --revision=40424
            fi
          else
            sudo snap install lxd --channel=6/stable --revision=40424
          fi
          test "$(snap list lxd | awk 'NR==2 {print $2 ":" $3}')" = 6.9-ab8fad2:40424
          sudo snap refresh --hold=forever lxd
          sudo /snap/bin/lxd waitready --timeout=60

      - name: Build and cold-boot the actual office guest
        timeout-minutes: 22
        run: >-
          sudo env PATH="${PATH}:/snap/bin" GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted GITHUB_SHA="${GITHUB_SHA}"
          node scripts/acceptance/office-image-prepare.mjs --out "${RUNNER_TEMP}/office-acceptance/image"

      - name: Prove paid office outage, sleep, resume, restart and reset
        timeout-minutes: 35
        run: >-
          sudo env PATH="${PATH}:/snap/bin" GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted GITHUB_SHA="${GITHUB_SHA}"
          node scripts/acceptance/office-lifecycle-physical.mjs
          --image-context "${RUNNER_TEMP}/office-acceptance/image/image-context.json"
          --out "${RUNNER_TEMP}/office-acceptance/lifecycle"
          --cpus 1

      - name: Upload bounded acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: office-docker-free-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/office-acceptance/host-packages.txt
            ${{ runner.temp }}/office-acceptance/postgres/evidence.json
            ${{ runner.temp }}/office-acceptance/concurrency/evidence.json
            ${{ runner.temp }}/office-acceptance/accounting-health/evidence.json
            ${{ runner.temp }}/office-acceptance/rpc/evidence.json
            ${{ runner.temp }}/office-acceptance/storage/evidence.json
            ${{ runner.temp }}/office-acceptance/image/evidence.json
            ${{ runner.temp }}/office-acceptance/image/dependency-pins.json
            ${{ runner.temp }}/office-acceptance/image/dependency-versions.json
            ${{ runner.temp }}/office-acceptance/image/package-manifest.json
            ${{ runner.temp }}/office-acceptance/image/image-context.json
            ${{ runner.temp }}/office-acceptance/image/office-image-bootstrap.json
            ${{ runner.temp }}/office-acceptance/image/image-trust-evidence.json
            ${{ runner.temp }}/office-acceptance/image/image-provenance.json
            ${{ runner.temp }}/office-acceptance/image/image-verification.json
            ${{ runner.temp }}/office-acceptance/lifecycle/evidence.json
          if-no-files-found: warn
          retention-days: 14
  workloads:
    if: ${{ !inputs.office_lifecycle_only && !inputs.regression_only }}
    name: Small-host physical workloads, pools and sustained usage
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Require disposable Linux host
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT}" = github-hosted
          test "$(uname -m)" = x86_64
          test "$(cat /proc/1/comm)" = systemd
          test -c /dev/kvm
          sudo -n python3 scripts/acceptance/paid-lxd-kvm.py
          df -h "${RUNNER_TEMP}"

      - name: Install dependencies without npm lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test isolated fixture boundaries
        run: node --test scripts/acceptance/native-postgres.test.mjs scripts/acceptance/office-rpc-server.test.mjs scripts/acceptance/workload-usage-evidence.test.mjs

      - name: Install native PostgreSQL and NFS tools
        timeout-minutes: 8
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc -o "${RUNNER_TEMP}/pgdg.asc"
          test "$(gpg --show-keys --with-colons "${RUNNER_TEMP}/pgdg.asc" | awk -F: '$1=="fpr" {print $10; exit}')" = B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
          sudo install -m 0644 "${RUNNER_TEMP}/pgdg.asc" /usr/share/keyrings/qorpera-acceptance-pgdg.asc
          echo 'deb [signed-by=/usr/share/keyrings/qorpera-acceptance-pgdg.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/qorpera-acceptance-pgdg.list
          sudo apt-get update
          sudo apt-get install --yes postgresql-17 postgresql-client-17 nfs-kernel-server nfs-common
          /usr/lib/postgresql/17/bin/postgres --version
          mkdir -p "${RUNNER_TEMP}/office-acceptance"
          dpkg-query -W postgresql-17 postgresql-client-17 nfs-kernel-server nfs-common > "${RUNNER_TEMP}/office-acceptance/host-packages.txt"

      - name: Install the reviewed LXD revision
        timeout-minutes: 8
        run: |
          set -euo pipefail
          if ! command -v snap >/dev/null; then
            sudo apt-get install --yes snapd
          fi
          sudo systemctl start snapd.socket
          sudo snap wait system seed.loaded
          if snap list lxd >/dev/null 2>&1; then
            if [ "$(snap list lxd | awk 'NR==2 {print $3}')" != 40424 ]; then
              sudo snap refresh lxd --channel=6/stable --revision=40424
            fi
          else
            sudo snap install lxd --channel=6/stable --revision=40424
          fi
          test "$(snap list lxd | awk 'NR==2 {print $2 ":" $3}')" = 6.9-ab8fad2:40424
          sudo snap refresh --hold=forever lxd
          sudo /snap/bin/lxd waitready --timeout=60

      - name: Build and cold-boot the actual office guest
        timeout-minutes: 22
        run: >-
          sudo env PATH="${PATH}:/snap/bin" GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted GITHUB_SHA="${GITHUB_SHA}"
          node scripts/acceptance/office-image-prepare.mjs --out "${RUNNER_TEMP}/office-acceptance/image"

      - name: Reconcile each physical workload and resource shape
        timeout-minutes: 110
        run: |
          set -euo pipefail
          case_number=0
          failed=0
          run_case() {
            case_number=$((case_number + 1))
            case_path="${RUNNER_TEMP}/workload-acceptance/case-${case_number}"
            if sudo env PATH="${PATH}:/snap/bin" GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted GITHUB_SHA="${GITHUB_SHA}" \
              node scripts/acceptance/workload-usage-physical.mjs "$@" \
              --image-context "${RUNNER_TEMP}/office-acceptance/image/image-context.json" --out "$case_path"; then
              return 0
            fi
            failed=1
            # A failed assertion need not hide independent cases, but uncertain
            # VM/database or host-service cleanup must halt this shared host.
            node --input-type=module -e 'import { readFile } from "node:fs/promises"; import assert from "node:assert/strict"; const report=JSON.parse(await readFile(process.argv[1],"utf8")); assert(report.cleanup===true && report.hostCleanup===true,"Cannot continue after unconfirmed workload cleanup");' "$case_path/evidence.json"
          }
          for kind in native coding login; do
            # Private-repository standard hosts have 2 CPUs / 8 GiB. Preserve
            # production headroom and test admitted shapes. Larger shapes are
            # a separate required acceptance run on a sufficiently sized host.
            for shape in '1 1' '1 4'; do
              read -r cpu_count memory_gib <<< "$shape"
              run_case --kind "$kind" --cpus "$cpu_count" --memory-gib "$memory_gib"
            done
          done
          for kind in native coding; do
            run_case --kind "$kind" --cpus 1 --memory-gib 2 --pool-fallback --renew
            run_case --kind "$kind" --cpus 1 --memory-gib 2 --plan dedicated
          done
          run_case --kind coding --cpus 1 --memory-gib 2 --shared-claims
          run_case --kind native --cpus 1 --memory-gib 2 --shape-mismatch
          test "$failed" -eq 0
      - name: Upload bounded workload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workload-docker-free-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/workload-acceptance/case-*/evidence.json
            ${{ runner.temp }}/office-acceptance/image/evidence.json
            ${{ runner.temp }}/office-acceptance/image/image-trust-evidence.json
          if-no-files-found: warn
          retention-days: 14
