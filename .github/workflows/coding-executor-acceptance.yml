name: Coding executor physical acceptance

on:
  workflow_call:

permissions:
  contents: read

jobs:
  coding-executor:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install reviewed harness dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install native PostgreSQL, NFS and Git sandbox prerequisites
        timeout-minutes: 8
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT}" = github-hosted
          test "$(uname -m)" = x86_64
          test "$(cat /proc/1/comm)" = systemd
          sudo python3 scripts/acceptance/paid-lxd-kvm.py
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc -o "${RUNNER_TEMP}/pgdg.asc"
          test "$(gpg --show-keys --with-colons "${RUNNER_TEMP}/pgdg.asc" | awk -F: '$1=="fpr" {print $10; exit}')" = B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
          sudo install -m 0644 "${RUNNER_TEMP}/pgdg.asc" /usr/share/keyrings/qorpera-acceptance-pgdg.asc
          echo 'deb [signed-by=/usr/share/keyrings/qorpera-acceptance-pgdg.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/qorpera-acceptance-pgdg.list
          sudo apt-get update
          sudo apt-get install --yes postgresql-17 postgresql-client-17 nfs-kernel-server nfs-common snapd bubblewrap git apparmor-profiles
          sudo apparmor_parser -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          sudo grep -Fxq 'bwrap (enforce)' /sys/kernel/security/apparmor/profiles
          sudo grep -Fxq 'unpriv_bwrap (enforce)' /sys/kernel/security/apparmor/profiles
          sudo chmod go-w "$(readlink -f "$(command -v node)")"
          sudo systemctl start snapd.socket
          sudo snap wait system seed.loaded
          if snap list lxd >/dev/null 2>&1; then
            if [ "$(snap list lxd | awk 'NR==2 {print $3}')" != 40424 ]; then
              sudo snap refresh lxd --channel=6/stable --revision=40424
            fi
          else
            sudo snap install lxd --channel=6/stable --revision=40424
          fi
          test "$(snap list lxd | awk 'NR==2 {print $2 ":" $3}')" = 6.9-ab8fad2:40424
          sudo snap refresh --hold=forever lxd
          sudo /snap/bin/lxd waitready --timeout=60
      - name: Verify bounded repository substitution and proof requirements
        run: node --test scripts/acceptance/coding-executor-fixture.test.mjs
      - name: Exercise actual workspace, command, detach, reuse and paid settlement
        timeout-minutes: 24
        run: |
          set -euo pipefail
          sudo env PATH="${PATH}:/snap/bin" GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted GITHUB_SHA="${GITHUB_SHA}" \
            node scripts/acceptance/coding-executor-physical.mjs --out "${RUNNER_TEMP}/coding-executor-acceptance"
      - name: Retain bounded physical executor evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coding-executor-physical-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/coding-executor-acceptance/evidence.json
          if-no-files-found: warn
          retention-days: 14
