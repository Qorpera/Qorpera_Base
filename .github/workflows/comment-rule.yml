name: Comment rule

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: comment-rule-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comments:
    name: New comments start with WHY
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check the comments this pull request adds or edits
        run: node scripts/check-comments.mjs --base HEAD^1 --head HEAD^2
