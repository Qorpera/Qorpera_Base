name: Hosted database contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/hosted-db.yml'
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'scripts/test-hosted-db.mjs'
      - 'scripts/test-hosted-db.test.mjs'
      - 'scripts/test-runtime-provenance.mjs'
      - 'scripts/generate-cloud-runtime-bundle*.mjs'

permissions:
  contents: read

concurrency:
  group: hosted-db-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrations:
    name: Migrations and SQL regression tests
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run harness unit tests
        run: node --test scripts/test-hosted-db.test.mjs

      - name: Apply all migrations and run SQL regression tests
        run: npm run test:hosted-db

      - name: Verify runtime upgrade and private audience contracts
        run: node scripts/test-runtime-provenance.mjs
