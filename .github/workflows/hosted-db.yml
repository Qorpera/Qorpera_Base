name: Hosted database contract

on:
  workflow_dispatch:
  push:
    branches: ['release/runtime-*']
  pull_request:
    paths:
      - '.github/workflows/hosted-db.yml'
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'scripts/test-hosted-db.mjs'
      - 'scripts/test-hosted-db.test.mjs'
      - 'scripts/test-runtime-bundle-activation.mjs'
      - 'scripts/test-email-draft-e2e.mjs'
      - 'scripts/fixtures/email-draft-e2e*'
      - 'packages/runtime/src/cloud-secret-*.ts'
      - 'packages/runtime/src/cloud-connector-*.ts'
      - 'packages/web/src/cloud/email-drafts.ts'
      - 'scripts/test-runtime-office-current-provider-activation.mjs'
      - 'scripts/test-runtime-node-capacity.mjs'
      - 'scripts/test-runtime-room-history.mjs'

# Release train (deploy/first-node/RUNTIME-RELEASE-TRAIN.md): only release
# branches declare the runtime bundle, so only they must carry derived files
# that match the source. Everywhere else the freshness asserts are skipped.
env:
  QORPERA_ENFORCE_RUNTIME_BUNDLE: ${{ ((github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/runtime-')) || (github.event_name == 'push' && startsWith(github.ref_name, 'release/runtime-'))) && '1' || '0' }}

permissions:
  contents: read

concurrency:
  group: hosted-db-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrations:
    name: Migrations and SQL regression tests
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run harness unit tests
        run: node --test scripts/test-hosted-db.test.mjs

      - name: Apply all migrations and run SQL regression tests
        run: npm run test:hosted-db

      - name: Runtime activation predecessor and concurrent deployment guards
        run: node scripts/test-runtime-bundle-activation.mjs

      - name: Email draft client, broker and PostgreSQL integration
        run: node scripts/test-email-draft-e2e.mjs

      - name: Node capacity and company computer slot suspension against disposable PostgreSQL
        run: node scripts/test-runtime-node-capacity.mjs

      - name: Verify office deletion disposition against disposable PostgreSQL
        run: node scripts/test-runtime-office-delete-disposition.mjs

      - name: Verify current office activation against disposable PostgreSQL
        run: node scripts/test-runtime-office-current-provider-activation.mjs

      - name: Room history accepted before the history upgrade against disposable PostgreSQL
        run: node scripts/test-runtime-room-history.mjs

  # The provenance script admits real runs under the source's runtime bundle, so it
  # needs the derived bundle files to match the source. Only release branches
  # guarantee that; feature branches lag until the next cut (release train). A
  # manual run on any branch whose bundle is fresh (master right after a cut) works too.
  runtime-provenance:
    name: Runtime bundle provenance and historical upgrade
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/runtime-')) || (github.event_name == 'push' && startsWith(github.ref_name, 'release/runtime-')) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Runtime bundle provenance and historical upgrade against disposable PostgreSQL
        run: node scripts/test-runtime-provenance.mjs
