name: Step 2 LXD contracts

on:
  workflow_dispatch:
    inputs:
      real_lxd_acceptance:
        description: Run the disposable nested-KVM paid guard acceptance instead of mock contracts
        type: boolean
        required: false
        default: false
      office_physical_acceptance:
        description: Run Docker-free native database, NFS and real office guest acceptance
        type: boolean
        required: false
        default: false
      office_lifecycle_only:
        description: Run only the office lifecycle acceptance without canceling the full physical matrix
        type: boolean
        required: false
        default: false
  push:
    branches: ['release/runtime-*']
  pull_request:
    paths:
      - '.github/workflows/step2-lxd.yml'
      - 'packages/runtime/src/cloud-runtime-bundle.generated.ts'
      - 'scripts/generate-cloud-runtime-bundle.mjs'
      - 'scripts/generate-cloud-runtime-bundle.test.mjs'
      - 'scripts/runtime-bundle-release-train.mjs'
      - 'scripts/fixtures/committed-runtime-bundle/**'
      - 'deploy/first-node/**'
      - 'deploy/lxd-runner-guest/**'
      - 'packages/runner-orchestrator/src/lxd-*.ts'
      - 'packages/runner-orchestrator/src/runtime-node-update*.ts'
      - 'packages/runner-orchestrator/src/provider-cli.ts'
      - 'packages/runner-orchestrator/src/provider-service.ts'
      - 'packages/runner-orchestrator/src/service.ts'
      - 'packages/runner-orchestrator/test/lxd-*.test.ts'
      - 'packages/runner-orchestrator/test/runtime-node-update*.test.ts'
      - 'packages/runner-orchestrator/test/provider-service.test.ts'
      - 'packages/runner-orchestrator/test/service.test.ts'
      - 'packages/runner-orchestrator/package.json'
      - 'packages/shell/src/cloud-native-provider*.ts'
      - 'packages/shell/src/cloud-runner-*.ts'
      - 'packages/shell/src/lxd-runner-*.ts'
      - 'packages/shell/src/account-auth.ts'
      - 'packages/shell/src/cloud-object-store.ts'
      - 'packages/shell/src/cloud-company-snapshot.ts'
      - 'packages/shell/test/account-auth.test.ts'
      - 'packages/shell/test/cloud-native-provider*.test.ts'
      - 'packages/shell/test/cloud-runner-*.test.ts'
      - 'packages/shell/test/cloud-company-file-contract.test.ts'
      - 'packages/shell/test/lxd-runner-*.test.ts'
      - 'packages/runtime/src/cloud-connector-*.ts'
      - 'packages/runtime/src/cloud-coding-*.ts'
      - 'packages/runtime/test/cloud-coding-*.test.ts'
      - 'packages/runtime/src/lxd-*.ts'
      - 'packages/runtime/test/lxd-*.test.ts'
      - 'packages/runtime/src/cloud-company-computer-service-main.ts'
      - 'packages/runtime/src/cloud-company-computer-preparation-main.ts'
      - 'packages/runtime/src/cloud-company-computer-diagnostics.ts'
      - 'packages/runtime/src/cloud-company-computer-outage-*.ts'
      - 'packages/runtime/test/cloud-company-computer-outage-*.test.ts'
      - 'packages/runtime/test/cloud-company-computer-service-main.test.ts'
      - 'packages/runtime/test/cloud-company-computer-preparation-main.test.ts'
      - 'packages/runtime/test/cloud-company-computer-diagnostics.test.ts'
      - 'scripts/office-image-self-update.test.mjs'
      - 'deploy/lxd-company-computer-guest/office-*.ts'
      - 'packages/runner-orchestrator/test/office-*.test.ts'
      - 'scripts/package-office-service-software-control*.mjs'
      - 'deploy/coding-worker/**'
      - 'deploy/runtime-computers/**'
      - 'packages/runner-orchestrator/test/*computer*.test.ts'
      - 'scripts/package-runtime-computer-guard*.mjs'
      - 'scripts/package-coding-executor*.mjs'
      - 'supabase/functions/computer-billing/**'
      - 'packages/runtime/src/cloud-secret-*.ts'
      - 'packages/shell/test/cloud-connector-*.test.ts'
      - 'packages/shell/test/cloud-secret-*.test.ts'
      - 'packages/shell/test/cloud-email-draft*.test.ts'
      - 'packages/web/src/cloud/email-drafts.ts'
      - 'scripts/package-lxd-*.mjs'
      - 'scripts/package-lxd-*.test.mjs'
      - 'scripts/package-company-computer*.mjs'
      - 'scripts/package-runtime-node-updater*.mjs'
      - 'scripts/package-shared-execution-service*.mjs'
      - 'scripts/jitless-service-bundle.mjs'
      - 'scripts/acceptance/**'
      - 'deploy/shared-execution/**'
      - 'deploy/node-tidy/**'
      - 'deploy/node-agent/**'
      - 'packages/runner-orchestrator/src/**'
      - 'packages/contracts/src/**'
      - 'supabase/functions/company-file-verifier/company-file-verifier.ts'
      - 'supabase/functions/company-file-verifier/company-file-verifier.test.ts'
      - 'supabase/functions/company-file-verifier/object-loader.ts'
      - 'supabase/functions/company-file-verifier/object-loader.test.ts'
      - 'supabase/functions/native-provider-login/**'
      - 'supabase/functions/runner-orchestrator/**'
      - 'package-lock.json'
      - 'package.json'

# Release train (deploy/first-node/RUNTIME-RELEASE-TRAIN.md): only release
# branches declare the runtime bundle, so only they must carry derived files
# that match the source. Everywhere else the freshness asserts are skipped.
env:
  QORPERA_ENFORCE_RUNTIME_BUNDLE: ${{ ((github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/runtime-')) || (github.event_name == 'push' && startsWith(github.ref_name, 'release/runtime-'))) && '1' || '0' }}

permissions:
  contents: read

concurrency:
  group: step2-lxd-${{ github.ref }}-${{ inputs.office_physical_acceptance && (inputs.office_lifecycle_only && 'office-lifecycle' || 'office') || inputs.real_lxd_acceptance && 'physical' || 'contracts' }}
  cancel-in-progress: true

jobs:
  office-physical-acceptance:
    if: github.event_name == 'workflow_dispatch' && inputs.office_physical_acceptance
    uses: ./.github/workflows/office-physical-acceptance.yml
    with:
      office_lifecycle_only: ${{ inputs.office_lifecycle_only }}

  contracts:
    name: Provider, guest, and package contracts
    if: github.event_name != 'workflow_dispatch' || (!inputs.real_lxd_acceptance && !inputs.office_physical_acceptance)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      TMPDIR: /tmp
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate deployment shell
        run: bash -n deploy/first-node/*.sh deploy/lxd-runner-guest/*.sh

      - name: Validate disposable acceptance harness syntax
        run: node --check scripts/acceptance/paid-lxd-guard.mjs

      - name: Test LXD provider contracts
        working-directory: packages/runner-orchestrator
        run: >-
          node ../../node_modules/vitest/dist/cli.js --run
          test/lxd-client.test.ts
          test/lxd-tracked-operations.test.ts
          test/lxd-guest-network.test.ts
          test/lxd-image-provenance.test.ts
          test/lxd-login-gateway.test.ts
          test/lxd-provider.test.ts
          test/lxd-company-runtime.test.ts
          test/runtime-node-inventory.test.ts
          test/shared-execution-backend.test.ts
          test/provider-service.test.ts
          test/service.test.ts
          test/runtime-node-update.test.ts
          test/runtime-node-update-registry.test.ts
          test/runtime-node-update-host.test.ts
          test/coding-executor.test.ts
          test/coding-executor-host.test.ts
          test/coding-machine.test.ts
          test/coding-vm.test.ts
          test/coding-storage.test.ts
          test/coding-workspace.test.ts
          test/coding-command-transport.test.ts
          test/coding-lease-transport.test.ts
          test/coding-git.test.ts
          test/coding-git-seed.test.ts
          test/coding-git-transfer.test.ts
          test/lxd-office-image-installation.test.ts
          test/lxd-office-image-self-update.test.ts
          test/office-self-update-mask.test.ts
          test/office-service-software-control.test.ts

      - name: Test paid computer custody and office lifecycle
        working-directory: packages/runner-orchestrator
        # The paid guard refuses tmpfs: reboot must not erase start/stop replay
        # fences. Ubuntu's /tmp may be tmpfs; use the runner's local work disk.
        env:
          TMPDIR: ${{ runner.temp }}
        run: >-
          node ../../node_modules/vitest/dist/cli.js --run --maxWorkers=2
          test/computer-paid-guard.test.ts
          test/computer-paid-guard-archive.test.ts
          test/computer-paid-usage.test.ts
          test/computer-guard-usage-uploader.test.ts
          test/computer-usage-observer.test.ts
          test/coding-computer-controller.test.ts
          test/runtime-computer-controller.test.ts
          test/runtime-computer-http-control.test.ts
          test/lxd-provider-paid.test.ts
          test/lxd-office-paid-computer.test.ts
          test/lxd-office-computer-outage.test.ts
          test/lxd-office-outage-resume-worker.test.ts
          test/lxd-office-outage-successor-control.test.ts
          test/lxd-office-outage-lineage.test.ts
          test/lxd-office-outage-coordinator.test.ts
          test/lxd-office-outage-lifecycle.test.ts
          test/lxd-office-outage-stop-evidence.test.ts
          test/lxd-office-outage-activation-history.test.ts
          test/lxd-office-boot-service-restart-journal.test.ts
          test/lxd-office-power-off-worker.test.ts
          test/lxd-office-operations.test.ts
          test/lxd-office-creation-worker.test.ts
          test/lxd-office-boot-worker.test.ts
          test/lxd-office-lifecycle.test.ts
          test/lxd-office-lifecycle-service.test.ts
          test/lxd-office-resume-worker.test.ts
          test/lxd-office-reset-worker.test.ts

      - name: Test coding session runtime contracts
        working-directory: packages/runtime
        run: >-
          node ../../node_modules/vitest/dist/cli.js --run
          test/cloud-native-coding-runtime.test.ts
          test/cloud-native-failure-code.test.ts
          test/cloud-coding-command-http.test.ts
          test/cloud-coding-command-tools.test.ts
          test/cloud-coding-command-log.test.ts
          test/cloud-coding-command-authority.test.ts
          test/cloud-coding-executor-config.test.ts
          test/cloud-coding-executor-control.test.ts
          test/cloud-coding-repository-credentials.test.ts
          test/cloud-coding-git-guest.test.ts
          test/cloud-coding-guest-configuration.test.ts
          test/cloud-coding-guest-package.test.ts
          test/cloud-coding-watchdog.test.ts
          test/cloud-coding-storage-guest.test.ts
          test/cloud-coding-session-guest.test.ts
          test/cloud-coding-configuration-install.test.ts
          test/cloud-coding-command-guest-execute.test.ts
          test/lxd-guest-image-updates.test.ts

      - name: Test the office guest image guard
        working-directory: packages/runtime
        run: >-
          node ../../node_modules/vitest/dist/cli.js --run
          test/cloud-company-computer-service-main.test.ts
          test/cloud-company-computer-preparation-main.test.ts
          test/cloud-company-computer-diagnostics.test.ts
          test/cloud-company-computer-outage-termination.test.ts
          test/cloud-company-computer-outage-contracts.test.ts

      - name: Test the coding command supervisor
        # Its fixtures chown each command log to the coding gid, which must be
        # >= 1000 and one the test user holds: run under such a group when the
        # runner's primary group is a system group.
        working-directory: packages/runtime
        run: |
          id
          supervisor="node ../../node_modules/vitest/dist/cli.js --run test/cloud-coding-command-guest.test.ts"
          if [ "$(id -g)" -ge 1000 ]; then
            $supervisor
          else
            sudo groupadd qorpera-coding-test
            sudo usermod -aG qorpera-coding-test "$(id -un)"
            sg qorpera-coding-test -c "$supervisor"
          fi

      - name: Test runner guest contracts
        working-directory: packages/shell
        run: >-
          node ../../node_modules/vitest/dist/cli.js --run
          test/cloud-native-provider-host.test.ts
          test/cloud-native-provider.test.ts
          test/account-auth.test.ts
          test/cloud-runner-assignment-inbox.test.ts
          test/cloud-runner-service.test.ts
          test/cloud-runner-worker.test.ts
          test/cloud-company-file-contract.test.ts
          test/lxd-runner-bootstrap.test.ts

      - name: Test cloud connectors and the secret broker
        working-directory: packages/shell
        run: >-
          node ../../node_modules/vitest/dist/cli.js --run
          test/cloud-connector-catalog.test.ts
          test/cloud-connector-github.test.ts
          test/cloud-connector-google.test.ts
          test/cloud-connector-oauth.test.ts
          test/cloud-connector-oauth-http.test.ts
          test/cloud-secret-broker.test.ts
          test/cloud-secret-broker-http.test.ts
          test/cloud-secret-tools.test.ts
          test/cloud-email-draft.test.ts
          test/cloud-email-draft-integration.test.ts

      - name: Test deterministic packaging
        run: >-
          node --test
          scripts/generate-cloud-runtime-bundle.test.mjs
          scripts/package-lxd-provider.test.mjs
          scripts/package-lxd-runner-guest.test.mjs
          scripts/package-company-computer.test.mjs
          scripts/package-runner-orchestrator.test.mjs
          scripts/package-runtime-node-updater.test.mjs
          scripts/package-shared-execution-service.test.mjs
          scripts/office-image-self-update.test.mjs
          scripts/package-office-service-software-control.test.mjs
          scripts/package-runtime-computer-guard.test.mjs
          scripts/package-coding-executor.test.mjs

      - name: Test computer billing with a fake payment provider
        run: node --test supabase/functions/computer-billing/computer-billing.test.ts

      - name: Test node tidy-up
        run: node --test deploy/node-tidy/qorpera-node-tidy.test.mjs

      - name: Test node agent and launcher
        run: |
          node --test deploy/node-agent/qorpera-node-agent.test.mjs
          python3 -m unittest discover -s deploy/node-agent -p 'test_*.py'

      - name: Test acceptance storage and verifier contracts
        run: >-
          node --test
          supabase/functions/company-file-verifier/object-loader.test.ts
          supabase/functions/company-file-verifier/company-file-verifier.test.ts

      - name: Test hosted orchestration boundaries
        run: >-
          node --test
          supabase/functions/native-provider-login/native-provider-login.test.ts
          supabase/functions/runner-orchestrator/runner-orchestrator.test.ts

      - name: Validate cloud and import boundaries
        run: |
          npm run check:cloud-boundaries
          npm run check:ts-imports
          npm run check:pinned-deps

  real-lxd-acceptance:
    name: Disposable nested-KVM paid guard acceptance
    if: github.event_name == 'workflow_dispatch' && inputs.real_lxd_acceptance && !inputs.office_physical_acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    # GitHub supports accelerated Linux workloads, but nested VMs are
    # experimental. This job cannot certify production host/image parity.
    # It uses synthetic permits and never connects to a live company or SQL.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Require disposable Linux host capabilities
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT}" = github-hosted
          test "$(uname -m)" = x86_64
          test "$(cat /proc/1/comm)" = systemd
          test -d /run/systemd/system
          test -c /dev/kvm
          sudo -n true
          sudo python3 -c 'import fcntl, os; fd=os.open("/dev/kvm", os.O_RDWR | os.O_CLOEXEC); assert fcntl.ioctl(fd, 0xAE00, 0)==12; vm=fcntl.ioctl(fd, 0xAE01, 0); os.close(vm); os.close(fd); print("KVM API 12 and VM creation verified")'
          systemd --version
          df -h "${RUNNER_TEMP}"

      - name: Install the reviewed LXD revision
        timeout-minutes: 8
        run: |
          set -euo pipefail
          if ! command -v snap >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes snapd
          fi
          sudo systemctl start snapd.socket
          sudo snap wait system seed.loaded
          if snap list lxd >/dev/null 2>&1; then
            if [ "$(snap list lxd | awk 'NR==2 {print $3}')" != 40424 ]; then
              sudo snap refresh lxd --channel=6/stable --revision=40424
            fi
          else
            sudo snap install lxd --channel=6/stable --revision=40424
          fi
          test "$(snap list lxd | awk 'NR==2 {print $2 ":" $3}')" = 6.9-ab8fad2:40424
          sudo snap refresh --hold=forever lxd
          sudo /snap/bin/lxd waitready --timeout=60

      - name: Exercise the paid guard against a real disposable VM
        timeout-minutes: 15
        run: |
          set -euo pipefail
          sudo env PATH="${PATH}:/snap/bin" GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted GITHUB_SHA="${GITHUB_SHA}" \
            node scripts/acceptance/paid-lxd-guard.mjs --out "${RUNNER_TEMP}/paid-lxd-acceptance"

      - name: Upload sanitized physical enforcement evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paid-lxd-physical-enforcement-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/paid-lxd-acceptance/evidence.json
            ${{ runner.temp }}/paid-lxd-acceptance/*.log
          if-no-files-found: warn
          retention-days: 14
