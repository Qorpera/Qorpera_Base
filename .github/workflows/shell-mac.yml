# Packs the macOS shell app on a real macOS runner and uploads the artifacts.
#
# This cannot fold into the other workflows' conventions in two ways, both
# deliberate:
#
#   * npm ci runs WITH lifecycle scripts. Everywhere else this repo installs
#     with --ignore-scripts, but packaging needs postinstall to fetch the
#     Electron binary and the per-platform clipboard vendor binaries; an
#     --ignore-scripts install packs an app that cannot launch.
#
#   * It runs on macos (arm64), not ubuntu. pack-shell.mjs assembles the
#     dependency closure from the host's node_modules, and npm only installs
#     the optional platform packages that match the host -- a Linux or
#     Windows assembly can never contain the darwin vendor binaries.
#
# manual dispatch only: a mac runner build is slow and releases are cut
# deliberately, not per-push. The produced dmg/zip are unsigned beyond
# electron-builder's ad-hoc signature (which Apple Silicon requires to launch
# at all), so a first open needs right-click - Open. Real signing and
# notarization arrive later via CSC_* secrets without changing this file.
name: Shell macOS pack

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack:
    name: Pack the shell for macOS (arm64)
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies (with lifecycle scripts; see header)
        run: npm ci --no-audit --no-fund

      # Model data is generated, gitignored, and asserted fresh by the build;
      # a bare checkout has none. Hydration reads public model catalogs and
      # needs no credentials.
      - name: Hydrate model data
        run: npm run hydrate:model-data

      - name: Build all workspaces
        run: npm run build:offline

      - name: Pack the macOS app
        run: node scripts/pack-shell.mjs

      - name: Upload the packed artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qorpera-base-mac-arm64
          if-no-files-found: error
          path: |
            build/shell-dist/*.dmg
            build/shell-dist/*.zip
            build/shell-dist/*.blockmap
            build/shell-dist/latest-mac.yml
