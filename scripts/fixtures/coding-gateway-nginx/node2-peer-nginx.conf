worker_processes 1;
pid /run/qorpera-coding-gateway-peer/nginx.pid;
error_log stderr crit;
events { worker_connections 256; }
http {
	access_log off;
	server_tokens off;
	client_body_temp_path /var/cache/qorpera-coding-gateway-peer/client;
	proxy_temp_path /var/cache/qorpera-coding-gateway-peer/proxy;
	fastcgi_temp_path /var/cache/qorpera-coding-gateway-peer/fastcgi;
	uwsgi_temp_path /var/cache/qorpera-coding-gateway-peer/uwsgi;
	scgi_temp_path /var/cache/qorpera-coding-gateway-peer/scgi;
	client_max_body_size 256k;
	client_body_buffer_size 256k;
	client_body_timeout 15s;
	proxy_connect_timeout 3s;
	proxy_send_timeout 60s;
	proxy_read_timeout 60s;
	proxy_http_version 1.1;
	proxy_set_header Host 127.0.0.1;
	proxy_set_header Connection close;
	proxy_set_header X-Forwarded-For "";
	proxy_request_buffering on;
	add_header Cache-Control no-store always;
	server {
		# Node 1 coding forward only (tailnet peer); TLS ends here as on the guest listener.
		listen 100.80.160.64:8789 ssl;
		allow 100.75.4.70;
		deny all;
		ssl_protocols TLSv1.3;
		ssl_certificate /run/credentials/qorpera-coding-gateway-peer.service/gateway.crt;
		ssl_certificate_key /run/credentials/qorpera-coding-gateway-peer.service/gateway.key;
		ssl_session_cache off;
		location / {
			limit_except POST { deny all; }
			proxy_pass http://127.0.0.1:18789;
		}
	}
}
