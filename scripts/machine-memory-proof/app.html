<!doctype html><meta charset=utf-8><title>app loading</title>
<style>body{font:14px system-ui;margin:0;background:#f4f5f7}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:16px}
.card{background:#fff;border-radius:10px;padding:12px;box-shadow:0 1px 3px #0002}.spin{width:28px;height:28px;border:4px solid #ccd;border-top-color:#36c;border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}canvas{width:100%;height:160px}</style>
<div class=grid id=g></div>
<script>
// A page like a small web app: three moving charts and 400 cards. The proof measures its frames a second.
const g=document.getElementById('g');
for(let i=0;i<3;i++){const c=document.createElement('div');c.className='card';c.style.gridColumn='span 4';c.innerHTML='<b>Chart '+(i+1)+'</b><div class=spin></div><canvas width=1500 height=160></canvas>';g.appendChild(c);}
for(let i=0;i<400;i++){const c=document.createElement('div');c.className='card';c.innerHTML='<b>Trip '+i+'</b><p>Weekend in the hills, '+(3+i%5)+' friends, '+(120+i*7)+' kr each.</p><svg width=80 height=24><rect width='+(10+i%70)+' height=24 fill=#36c /></svg>';g.appendChild(c);}
const cs=[...document.querySelectorAll('canvas')].map(c=>c.getContext('2d'));
function draw(now){for(const [k,x] of cs.entries()){x.clearRect(0,0,1500,160);x.beginPath();for(let i=0;i<1500;i+=3){const y=80+60*Math.sin(i/40+now/400+k)*Math.cos(i/90+now/900);i?x.lineTo(i,y):x.moveTo(i,y);}x.strokeStyle='#36c';x.lineWidth=2;x.stroke();}requestAnimationFrame(draw);}
requestAnimationFrame(draw);document.title='APP ready';
</script>
