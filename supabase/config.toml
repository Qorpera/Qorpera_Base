[auth]
site_url = "https://qorpera.com"
additional_redirect_urls = []

[auth.email]
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.profile-invitation-email]
verify_jwt = false

# Called by pg_cron with a Supabase secret key, which it checks itself (like the invitation worker).
[functions.computer-hour-notices]
verify_jwt = false

# The cleanup worker accepts a modern non-JWT Supabase secret key through its
# own exact-key boundary. The platform JWT gate cannot
# parse sb_secret keys, so it is disabled here and the handler remains the
# authority. The other functions authenticate their own runner/mail callers.
[functions.artifact-gc-worker]
verify_jwt = false

[functions.company-file-verifier]
verify_jwt = true

[functions.runner-control]
verify_jwt = false

[functions.runner-orchestrator]
verify_jwt = false

[functions.runner-broker]
verify_jwt = false

[functions.native-provider-login]
verify_jwt = false

# The member gateway preserves the JWT for authoritative checks at the object
# gateway. OPTIONS carries no JWT; no service-role authority is added.
[functions.member-company-gateway]
verify_jwt = false

# Computer hours payments: /checkout and /portal check the member's JWT themselves, and /webhook
# carries Stripe's signature instead of a JWT.
[functions.computer-billing]
verify_jwt = false

# Event intake: public. A hook's address is its route; signed hooks carry the sender's signature,
# which the vault checks. There is no JWT to check.
[functions.event-intake]
verify_jwt = false

# Mail intake: public, for the mail provider's webhook (Resend), which it checks with the platform's signing
# secret (Standard Webhooks). There is no JWT to check.
[functions.mail-intake]
verify_jwt = false
