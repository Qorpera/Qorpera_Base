<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Qorpera Base</title>
<style>
	/* ---- design tokens (generalize everything against these) ----------------
	 * Palette and type lifted from Qorpera Desktop's dark theme: near-black
	 * chrome (titlebar + sidebar) framing one rounded warm-dark content sheet. */
	@font-face {
		font-family: "Source Sans 3";
		font-style: normal;
		font-weight: 200 900;
		font-display: swap;
		src: url("./fonts/source-sans-3-latin-normal.woff2") format("woff2");
	}
	@font-face {
		font-family: "Source Sans 3";
		font-style: italic;
		font-weight: 200 900;
		font-display: swap;
		src: url("./fonts/source-sans-3-latin-italic.woff2") format("woff2");
	}
	:root {
		color-scheme: dark;
		--chrome: #101010;            /* titlebar + sidebar */
		--bg: #2d2d2b;                /* the content sheet */
		--pane: #2d2d2b;
		--pane-strong: #3a3a38;
		--hover: #3f4241;
		--text: #f9f9f7;
		--text-muted: #b8b8b3;
		--text-soft: #8f8f8a;
		--border: #3d3d3b;
		--border-strong: #51514d;
		--accent: #cc7d5e;
		--accent-soft: #3f2d28;
		--blue: #8fa8ff;
		--danger: #ff5f38;
		--danger-soft: #442821;
		--warning: #d8a758;
		--warning-soft: #3d3323;
		--ok: #73d5b1;
		--send-idle: #3f4241;
		--send-active: #0161bc;
		--send-active-hover: #0057a8;
		--titlebar-height: 40px;
		--thread-width: 760px;
		--font-sans: "Source Sans 3", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
		--font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
	}
	* { box-sizing: border-box; margin: 0; }
	body {
		display: flex; flex-direction: column; height: 100vh; overflow: hidden;
		font-family: var(--font-sans); font-size: 14px;
		background: var(--chrome); color: var(--text);
		text-rendering: optimizeLegibility; font-synthesis: none;
	}
	button, input, select, textarea { font: inherit; }
	button {
		min-height: 30px; border: 1px solid var(--border); border-radius: 6px;
		background: var(--pane); color: var(--text); padding: 0 10px;
		cursor: default; white-space: nowrap;
	}
	button:hover:not(:disabled) { border-color: var(--border-strong); background: var(--pane-strong); }
	button:disabled { opacity: 0.48; }
	button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
		outline: 1px solid var(--border-strong); outline-offset: 1px;
	}
	input, select, textarea {
		border: 1px solid var(--border); border-radius: 6px;
		background: var(--bg); color: var(--text);
	}
	select { color-scheme: dark; }
	code, pre { font-family: var(--font-mono); }
	::-webkit-scrollbar { width: 14px; height: 14px; }
	::-webkit-scrollbar-track { background: transparent; }
	::-webkit-scrollbar-thumb {
		border: 4px solid transparent; border-radius: 999px;
		background: rgba(148, 152, 156, 0.42); background-clip: content-box;
	}

	/* ---- titlebar (frameless window; native overlay draws min/max/close) --- */
	#titlebar {
		display: grid; grid-template-columns: auto minmax(0, 1fr);
		align-items: center; flex: 0 0 auto;
		height: var(--titlebar-height); padding-left: 14px;
		background: var(--chrome); user-select: none;
		-webkit-app-region: drag;
	}
	#wordmark {
		color: #b6b6ae; font-size: 12px; font-weight: 560;
		letter-spacing: 0.02em; line-height: 1; white-space: nowrap;
	}

	/* ---- shell: sidebar + rounded content sheet ----------------------------- */
	#shell { flex: 1; display: flex; min-height: 0; }
	nav {
		width: var(--nav-width, 250px); min-width: 0; flex: 0 0 auto; background: var(--chrome);
		padding: 6px 14px 14px; display: flex; flex-direction: column;
		overflow-y: auto; scrollbar-width: thin;
		scrollbar-color: rgba(249, 249, 247, 0.075) transparent;
	}
	/* Drag handles between panes: invisible until hovered/dragged. */
	.paneHandle { flex: 0 0 4px; cursor: col-resize; background: transparent; z-index: 6; }
	.paneHandle:hover, .paneHandle[data-dragging] { background: rgba(249, 249, 247, 0.14); }
	#view-surfacewrap > .paneHandle { display: none; }
	#view-surfacewrap.chat-open > .paneHandle { display: block; }
	/* The nav panes must be flex columns or the spacer can't pin the
	   profile/settings row to the bottom. */
	#hubnav, #conav { display: flex; flex-direction: column; flex: 1; min-height: 0; gap: 3px; }
	nav h1 { font-size: 14px; margin-bottom: 10px; }
	nav h1 small { display: block; color: var(--text-soft); font-weight: 400; font-size: 11px; margin-top: 2px; }
	nav h2 {
		font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em;
		color: var(--text-soft); font-weight: 560; margin: 12px 0 4px;
	}
	nav button, .gate button {
		text-align: left; background: none; border: 0; color: var(--text-muted);
		padding: 6px 9px; border-radius: 6px; cursor: pointer; font-size: 13px; width: 100%;
	}
	nav button:hover { background: rgba(249, 249, 247, 0.055); color: var(--text); }
	nav button.active { background: rgba(249, 249, 247, 0.09); color: var(--text); }
	main {
		flex: 1; display: flex; flex-direction: column; min-width: 0;
		background: var(--bg); border-radius: 14px 0 0 0; overflow: hidden;
	}

	/* ---- surface view: iframe + docked sidechat ------------------------------
	   Every surface carries a sidechat — a chat panel docked beside it where the
	   founder talks to the controller IN that surface's context. Chrome-level by
	   design: the surface iframe never gains session-starting power; the dock
	   hosts the one real chat machinery (#view-chat moves in and out). */
	#view-surfacewrap { flex: 1; display: none; min-height: 0; position: relative; }
	#view-surface { flex: 1; border: 0; min-width: 0; background: var(--bg); }
	#sidechat {
		width: var(--sidechat-width, 420px); min-width: 0; flex: 0 0 auto;
		display: none; flex-direction: column;
		min-height: 0; border-left: 1px solid var(--border); background: var(--bg);
	}
	#view-surfacewrap.chat-open #sidechat { display: flex; }
	#sidechat-head {
		display: flex; align-items: center; gap: 6px; flex: 0 0 auto;
		padding: 8px 10px 8px 14px; border-bottom: 1px solid var(--border);
		font-size: 12.5px; color: var(--text-muted);
	}
	#sidechat-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 560; }
	#sidechat-head .catBtn { width: auto; padding: 0 7px; font-size: 13px; color: var(--text-soft); border: 1px solid var(--border); border-radius: 5px; background: none; cursor: pointer; min-height: 22px; }
	#sidechat-head .catBtn:hover { color: var(--text); background: rgba(249, 249, 247, 0.055); }
	/* Collapsed: a floating pill over the surface invites the conversation. */
	#sidechatTab {
		position: absolute; top: 12px; right: 14px; z-index: 3;
		border: 1px solid var(--border); border-radius: 999px; padding: 4px 14px;
		background: rgba(61, 61, 59, 0.92); color: var(--text-muted); font-size: 12.5px;
		-webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
		box-shadow: 0 8px 22px rgba(0, 0, 0, 0.25); cursor: pointer;
	}
	#sidechatTab:hover { color: var(--text); border-color: var(--border-strong); }
	#view-surfacewrap.chat-open #sidechatTab { display: none; }
	/* The docked thread is narrow: tighten the chrome-sized paddings. */
	#sidechat #messages { padding: 16px 12px 150px; }
	#sidechat #composer-footer { padding: 0 10px; bottom: 10px; }
	#sidechat .composer-shell { min-height: 86px; border-radius: 16px; padding: 12px 10px 6px; }
	#sidechat .stripchip { max-width: 120px; }
	#view-panel { flex: 1; padding: 22px; overflow-y: auto; display: none; }

	/* ---- chat thread --------------------------------------------------------- */
	#view-chat { flex: 1; display: none; flex-direction: column; min-height: 0; position: relative; }
	#messages {
		flex: 1; overflow-y: auto;
		padding: 24px max(18px, calc((100% - var(--thread-width)) / 2)) 170px;
		display: flex; flex-direction: column; gap: 10px;
	}
	.msg { width: 100%; max-width: var(--thread-width); white-space: pre-wrap; line-height: 1.5; }
	.msg.assistant { white-space: normal; }
	.msg.assistant p { margin: 0 0 8px; }
	.msg.assistant h1, .msg.assistant h2, .msg.assistant h3 { margin: 12px 0 6px; font-size: 15px; }
	.msg.assistant ul, .msg.assistant ol { margin: 0 0 8px 22px; }
	.msg.assistant code { background: rgba(249, 249, 247, 0.08); border-radius: 4px; padding: 1px 5px; font-family: var(--font-mono); font-size: 12.5px; }
	.msg.assistant pre { background: #262625; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; overflow-x: auto; margin: 0 0 8px; }
	.msg.assistant pre code { background: none; padding: 0; }
	.msg.assistant table { border-collapse: collapse; margin: 0 0 8px; }
	.msg.assistant td, .msg.assistant th { border: 1px solid var(--border-strong); padding: 4px 9px; font-size: 13px; }
	.msg.assistant blockquote { border-left: 3px solid var(--border-strong); margin: 0 0 8px; padding-left: 10px; color: var(--text-muted); }
	.msg.user { width: auto; max-width: 85%; align-self: flex-end; background: var(--pane-strong); border-radius: 14px; padding: 10px 14px; }
	.msg.tool { color: var(--text-soft); font-family: var(--font-mono); font-size: 12px; }
	.msg.thinking { color: var(--text-soft); font-style: italic; }
	.msg.log { color: var(--danger); opacity: 0.75; font-family: var(--font-mono); font-size: 12px; }

	/* Collapsible run group: tool calls + thinking fold under "Worked for…". */
	details.work { width: 100%; max-width: var(--thread-width); }
	details.work summary {
		display: inline-flex; align-items: center; gap: 6px; list-style: none;
		color: var(--text-muted); font-size: 13px; cursor: pointer; user-select: none;
		padding: 2px 0; border-radius: 6px;
	}
	details.work summary::-webkit-details-marker { display: none; }
	details.work summary::before { content: "▸"; font-size: 10px; color: var(--text-soft); transition: transform 120ms ease; }
	details.work[open] summary::before { transform: rotate(90deg); }
	details.work summary:hover { color: var(--text); }
	details.work .workbody {
		display: flex; flex-direction: column; gap: 5px;
		border-left: 2px solid var(--border); margin: 6px 0 2px 3px; padding-left: 12px;
	}
	details.work .workbody .msg { max-width: 100%; }

	/* ---- composer: the Codex shell (floats over the thread) ------------------ */
	#composer-footer {
		position: absolute; z-index: 2; left: 0; right: 0; bottom: 16px;
		display: grid; justify-items: center; padding: 0 18px;
		pointer-events: none;
	}
	.composer-shell {
		pointer-events: auto;
		position: relative; display: flex; flex-direction: column; gap: 8px;
		width: min(var(--thread-width), 100%); min-height: 98px;
		border: 1px solid transparent; border-radius: 20px;
		background: rgba(61, 61, 59, 0.92);
		-webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
		box-shadow: 0 18px 42px rgba(0, 0, 0, 0.2), 0 1px 2px rgba(0, 0, 0, 0.18);
		padding: 15px 13px 8px; overflow: hidden;
	}
	.composer-shell:focus-within {
		box-shadow:
			0 18px 42px rgba(0, 0, 0, 0.22),
			0 1px 2px rgba(0, 0, 0, 0.18),
			0 0 0 1px rgba(249, 249, 247, 0.05) inset;
	}
	.composer-shell textarea {
		width: 100%; min-height: 35px; max-height: 270px;
		border: 0; border-radius: 0; background: transparent; color: var(--text);
		padding: 0 4px; font-size: 14px; line-height: 1.45;
		outline: 0; resize: none; overflow-y: auto;
	}
	.composer-shell textarea::placeholder { color: rgba(249, 249, 247, 0.36); }
	.composer-strip {
		display: flex; align-items: center; gap: 5px;
		min-height: 32px; margin-top: auto; color: rgba(249, 249, 247, 0.62);
	}
	.composer-spacer { flex: 1 1 auto; min-width: 0; }
	/* Chip selects: native <select> popups can't be styled (white popup,
	   unreadable options) — the strip uses custom menus, Desktop-style. */
	.chipwrap { position: relative; display: inline-flex; }
	.stripchip {
		display: inline-flex; align-items: center; gap: 5px;
		border: 0; border-radius: 8px; background: transparent; color: #c4c4be;
		min-height: 26px; padding: 3px 9px; font-size: 12.5px; font-weight: 460;
		max-width: 240px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
	}
	.stripchip::after { content: "▾"; font-size: 9px; color: var(--text-soft); }
	.stripchip:hover:not(:disabled), .stripchip[aria-expanded="true"] {
		background: rgba(235, 232, 224, 0.049); color: #e6e6e3; border: 0;
	}
	/* The menu lives in a fixed layer on <body> — inside the composer shell it
	   would be clipped by overflow:hidden and distorted by the backdrop
	   filter's stacking context. JS positions it from the button rect. */
	.chipmenu {
		position: fixed; z-index: 1000;
		display: none; flex-direction: column; gap: 1px;
		min-width: 230px; max-height: 320px; overflow-y: auto;
		padding: 5px; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 10px;
		background: #3d3d3b; color: #e6e6e3;
		box-shadow: 0 18px 42px rgba(0, 0, 0, 0.4);
	}
	.chipmenu.open { display: flex; }
	.chipmenu button {
		display: flex; align-items: center; gap: 8px; width: 100%;
		border: 0; border-radius: 6px; background: transparent; color: #e6e6e3;
		text-align: left; font-size: 13px; padding: 7px 10px; min-height: 0;
	}
	.chipmenu button:hover { background: rgba(249, 249, 247, 0.07); border: 0; }
	/* Option icons (scope menu: building = company, package = product). */
	.chipicon { width: 14px; height: 14px; flex: 0 0 auto; color: var(--text-soft); }
	.chipmenu button.selected .chipicon { color: var(--text-muted); }
	.stripchip .chipicon { width: 13px; height: 13px; margin-right: 1px; }
	.chipmenu button.selected { color: var(--text); font-weight: 600; }
	.chipmenu button.selected::after { content: "✓"; margin-left: auto; padding-left: 14px; font-size: 11px; font-weight: 400; color: var(--text-soft); }
	/* ---- model control: effort slider + model dropdown + speed toggle -------
	   Desktop-style single panel replacing the separate model/effort chips. */
	.chipmenu.modelctl { min-width: 320px; padding: 12px 14px 14px; gap: 8px; }
	.mc-head { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-soft); font-weight: 600; margin-top: 4px; }
	.mc-head:first-child { margin-top: 0; }
	.mc-row { display: flex; align-items: center; gap: 10px; min-height: 26px; }
	/* Desktop-look slider: thick rounded track painted by JS (accent fill up
	   to the knob + a faint dot per stop), big white knob. */
	.mc-row input[type="range"] {
		-webkit-appearance: none; appearance: none;
		flex: 1; height: 22px; margin: 0; background: transparent; outline: none;
	}
	.mc-row input[type="range"]::-webkit-slider-runnable-track {
		height: 14px; border-radius: 999px; background: var(--mc-track, #4a4a47);
	}
	.mc-row input[type="range"]::-webkit-slider-thumb {
		-webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%;
		background: #ffffff; box-shadow: 0 1px 5px rgba(0, 0, 0, 0.45); margin-top: -4px;
	}
	.mc-value { min-width: 74px; text-align: right; font-size: 12.5px; color: var(--text); }
	.chipmenu button.mc-drop {
		width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px;
		border: 1px solid var(--border); border-radius: 8px; background: var(--bg); padding: 7px 10px;
	}
	.chipmenu button.mc-drop:hover { border: 1px solid var(--border-strong); background: var(--bg); }
	.mc-drop::after { content: "›"; font-size: 14px; line-height: 1; color: var(--text-soft); }
	.mc-list {
		display: none; flex-direction: column; gap: 1px; max-height: 220px; overflow-y: auto;
		border: 1px solid var(--border); border-radius: 8px; background: #333331; padding: 4px;
	}
	.mc-list.open { display: flex; }
	.chipmenu button.mc-toggle {
		position: relative; width: 36px; height: 20px; min-height: 20px; flex: 0 0 auto; padding: 0;
		border: 1px solid var(--border-strong); border-radius: 999px; background: var(--pane-strong);
	}
	.mc-toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px;
		border-radius: 50%; background: var(--text-soft); transition: left 120ms ease, background 120ms ease; }
	.chipmenu button.mc-toggle[aria-checked="true"] { background: var(--send-active); }
	.mc-toggle[aria-checked="true"]::after { left: 18px; background: #ffffff; }
	.chipmenu button.mc-toggle:disabled { opacity: 0.45; }
	.mc-note { font-size: 11px; color: var(--text-soft); line-height: 1.4; }
	.composer-send {
		display: grid; place-items: center; width: 32px; height: 32px; min-height: 32px;
		padding: 0; border: 0; border-radius: 999px; flex: 0 0 auto;
		background: var(--send-idle); color: #ffffff; line-height: 0;
		transition: background 120ms ease;
	}
	.composer-send:hover:not(:disabled) { border: 0; background: var(--send-idle); }
	.composer-send[data-active="true"] { background: var(--send-active); }
	.composer-send[data-active="true"]:hover:not(:disabled) { background: var(--send-active-hover); }
	.composer-send svg { width: 17px; height: 17px; stroke-width: 1.9; }

	/* ---- inbox cards ----------------------------------------------------------
	   Item shapes: a DECISION (gate → Approve/Deny), a QUESTION (message →
	   respond), or a NOTIFICATION (message/note that only informs → Settle).
	   Cards lead with a compact head + the decision-critical line; the full
	   body stays behind Details. */
	/* Centered column, same width discipline as the chat thread. */
	#view-panel { padding: 28px max(22px, calc((100% - var(--thread-width)) / 2)); }
	#view-panel h1 { font-size: 18px; margin: 4px 0 16px; }
	.inbox-section { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-soft); font-weight: 600; margin: 22px 0 8px; }
	.card {
		border: 1px solid var(--border); border-radius: 12px;
		background: rgba(249, 249, 247, 0.02); padding: 14px 16px; margin-bottom: 10px;
	}
	.card.settled { opacity: 0.62; }
	.card-head { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
	.card-title { font-size: 14px; font-weight: 600; flex: 1; min-width: 0; }
	.kchip {
		flex: 0 0 auto; font-size: 10.5px; font-weight: 600; text-transform: uppercase;
		letter-spacing: 0.04em; border-radius: 5px; padding: 2px 6px;
		background: var(--pane-strong); color: var(--text-muted); align-self: center;
	}
	.kchip.gate { background: var(--accent-soft); color: var(--accent); }
	.card-meta { font-size: 11px; color: var(--text-soft); margin-top: 3px; }
	.card-meta .dot-pending { color: var(--warning); }
	.card-meta .dot-ok { color: var(--ok); }
	.card-meta .dot-denied { color: #f0a9a0; }
	.card-intent { margin-top: 10px; font-size: 13.5px; color: var(--text); line-height: 1.55; }
	.card-what {
		font-family: var(--font-mono); font-size: 12px; color: var(--text-muted);
		background: #262625; border: 1px solid var(--border); border-radius: 7px;
		padding: 7px 10px; margin-top: 10px; overflow-x: auto; white-space: pre-wrap;
	}
	.card-body { margin-top: 10px; font-size: 13px; color: var(--text-muted); line-height: 1.5; overflow: hidden; }
	.card-body.clamped {
		max-height: 5.6em;
		-webkit-mask-image: linear-gradient(#000 60%, transparent);
		mask-image: linear-gradient(#000 60%, transparent);
	}
	.card-body > :first-child { margin-top: 0; }
	.card-body h1, .card-body h2, .card-body h3 { font-size: 13px; color: var(--text); margin: 10px 0 4px; }
	.card-body p, .card-body ul, .card-body ol { margin: 0 0 6px; }
	.card-body ul, .card-body ol { padding-left: 20px; }
	.card-body code { background: rgba(249, 249, 247, 0.08); border-radius: 4px; padding: 0 4px; font-size: 12px; }
	.card-body pre { background: #262625; border: 1px solid var(--border); border-radius: 7px; padding: 8px 10px; overflow-x: auto; }
	.card-actions { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
	.card-actions button { min-height: 27px; font-size: 12.5px; padding: 0 12px; border-radius: 7px; }
	.card-actions .ok { border-color: #3f5a4b; color: var(--ok); }
	.card-actions .no { border-color: #5d3f3c; color: #f0a9a0; }
	.card-actions .ghost { border-color: transparent; background: none; color: var(--text-soft); }
	.card-actions .ghost:hover { border-color: transparent; background: rgba(249, 249, 247, 0.05); color: var(--text); }
	.card-reply { margin-top: 10px; }
	.card-reply textarea { width: 100%; padding: 8px 10px; resize: vertical; min-height: 62px; margin-bottom: 8px; font-size: 13px; }

	/* ---- cards, inbox, status -------------------------------------------------- */
	.gate {
		border: 1px solid var(--border); border-radius: 10px;
		background: rgba(249, 249, 247, 0.02); padding: 13px 15px; margin-bottom: 10px;
	}
	.gate .t { font-weight: 600; margin-bottom: 3px; }
	.gate .s { font-size: 12px; color: var(--text-soft); margin-bottom: 8px; }
	.gate button { width: auto; margin-right: 8px; padding: 5px 14px; border: 1px solid var(--border-strong); background: var(--pane); }
	.gate button.ok { border-color: #3f5a4b; color: var(--ok); }
	.gate button.no { border-color: #5d3f3c; color: #f0a9a0; }
	.gate .body { margin: 8px 0; }
	.gate textarea { width: 100%; padding: 8px 10px; resize: vertical; min-height: 56px; margin-bottom: 8px; }
	#sessions button { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	/* Scoped-chat tag in the sidebar: names the product the session steers. */
	.scopetag, .surfacetag {
		margin-left: 6px; padding: 1px 6px; border-radius: 5px;
		background: var(--accent-soft); color: var(--accent);
		font-size: 10.5px; font-weight: 600; letter-spacing: 0.02em;
	}
	/* Sidechat sessions carry the surface they were docked to. */
	.surfacetag { background: rgba(143, 168, 255, 0.14); color: var(--blue); }
	h2.cat { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
	h2.cat .catBtn { width: auto; margin-left: auto; padding: 0 7px; font-size: 14px; color: var(--text-soft); border: 1px solid var(--border); border-radius: 5px; background: none; cursor: pointer; }
	h2.cat .catBtn:hover { color: var(--text); background: rgba(249, 249, 247, 0.055); }
	#chatsCaret { font-size: 10px; color: var(--text-soft); }
	.loading { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--text-soft); }
	.profileRow { display: flex !important; align-items: center; gap: 10px; border-top: 1px solid rgba(249, 249, 247, 0.08) !important; border-radius: 0 !important; padding-top: 12px !important; margin-top: 8px; flex: 0 0 auto; }
	.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--pane-strong); display: inline-flex; align-items: center; justify-content: center; font-weight: 600; flex-shrink: 0; }
	.profileText small { color: var(--text-soft); }
	.navspacer { flex: 1; min-height: 12px; }
	.hubver { color: var(--text-soft); font-size: 11px; padding: 0 9px 8px; }
	/* display set via .open class — never on the bare id, or the hidden
	   attribute loses to author CSS and Back can't close the page. */
	#settingsView { position: fixed; top: var(--titlebar-height); right: 0; bottom: 0; left: 0; display: none; background: var(--chrome); z-index: 20; }
	#settingsView.open { display: flex; }
	#settingsView nav { width: 220px; min-width: 220px; padding-top: 14px; }
	#settingsView .stab.active { background: rgba(249, 249, 247, 0.09); color: var(--text); }
	#settingsContent { flex: 1; overflow-y: auto; padding: 28px 36px; background: var(--bg); border-radius: 14px 0 0 0; }
	#settingsContent > * { max-width: 700px; }
	.setrow { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--border); }
	.setrow label { flex: 1; }
	.setrow label small { display: block; color: var(--text-soft); font-size: 12px; margin-top: 2px; }
	.setrow select, .setrow input[type=number] { width: auto; padding: 6px 10px; }
	.setrow input[type=number] { width: 90px; }
	#settingsContent h1 { font-size: 18px; margin: 14px 0; }
	#settingsContent h1:first-child { margin-top: 0; }
	#settingsContent textarea { width: 100%; border-radius: 8px; padding: 10px 12px; font-family: var(--font-mono); font-size: 12.5px; min-height: 240px; }
	#settingsContent .save { margin-top: 14px; padding: 8px 20px; border-radius: 8px; border-color: #3f5a4b; }
	.empty { color: var(--text-soft); padding: 36px; text-align: center; }
	.badge { background: var(--danger-soft); color: #f0a9a0; border-radius: 10px; font-size: 11px; padding: 1px 7px; margin-left: 6px; }
	#status { padding: 6px 16px; border-top: 1px solid var(--border); color: var(--text-soft); font-size: 11px; min-height: 25px; }
	.sess-meta { color: var(--text-soft); font-size: 11px; }
	.hubbtn { border: 1px solid var(--border) !important; margin-bottom: 6px; padding: 10px 12px !important; }
</style>
</head>
<body>
<header id="titlebar">
	<span id="wordmark">Qorpera Base</span>
	<div></div>
</header>
<div id="shell">
<nav>
	<div id="hubnav">
		<!-- No h1 here: the titlebar wordmark already says Qorpera Base. -->
		<h2>Companies</h2>
		<div id="companies"></div>
		<button class="hubbtn" onclick="newCompanyPrompt()">+ New company…</button>
		<button class="hubbtn" onclick="integrateCompanyPrompt()">+ Integrate existing repo…</button>
		<h2>Cloud</h2>
		<button class="hubbtn" disabled title="Sync, community, and compliance — not built yet">Connect to Qorpera Cloud (soon)</button>
		<div class="navspacer"></div>
		<div class="hubver" id="hubVersion"></div>
		<button class="profileRow" onclick="openSettings('general')"><span class="avatar">F</span><span class="profileText">Founder<br><small>Settings</small></span></button>
	</div>
	<div id="conav" style="display:none">
		<h2>Company</h2>
		<button id="inboxBtn" onclick="show('inbox')">Inbox<span id="inboxBadge"></span></button>
		<button id="activityBtn" onclick="show('activity')">Activity</button>
		<h2 class="cat" onclick="toggleChats()">Chats<span id="chatsCaret">▾</span><button class="catBtn" onclick="event.stopPropagation(); newChat()" title="New chat">+</button></h2>
		<div id="sessions"></div>
		<h2>Surfaces</h2>
		<div id="surfaces"><div class="empty" style="padding:6px">none built yet</div></div>
		<div class="navspacer"></div>
		<button class="profileRow" onclick="openSettings('general')"><span class="avatar">F</span><span class="profileText">Founder<br><small>Settings</small></span></button>
	</div>
</nav>
<div id="navHandle" class="paneHandle" title="Drag to resize the sidebar"></div>
<main>
	<div id="view-chat">
		<div id="messages"></div>
		<div id="composer-footer">
			<div class="composer-shell">
				<textarea id="input" rows="1" placeholder="Steer the company… (Enter to send, Shift+Enter for newline)"></textarea>
				<div class="composer-strip">
					<div class="chipwrap">
						<button id="scopeBtn" class="stripchip" title="Session scope — the company, or one of its products" aria-haspopup="menu" aria-expanded="false">…</button>
						<div id="scopeMenu" class="chipmenu"></div>
					</div>
					<span class="composer-spacer"></span>
					<div class="chipwrap">
						<button id="modelCtlBtn" class="stripchip" title="Model · effort · speed" aria-haspopup="menu" aria-expanded="false">…</button>
						<div id="modelCtlMenu" class="chipmenu modelctl" role="menu" aria-label="Model control">
							<div class="mc-head">Effort</div>
							<div class="mc-row">
								<input id="mcEffort" type="range" min="0" max="3" step="1" value="2" aria-label="Reasoning effort">
								<span id="mcEffortValue" class="mc-value">…</span>
							</div>
							<div class="mc-head">Model</div>
							<button id="mcModelDrop" class="mc-drop" type="button"><span id="mcModelLabel">…</span></button>
							<div id="mcModelList" class="mc-list"></div>
							<div class="mc-head">Speed</div>
							<div class="mc-row">
								<span style="flex:1">Fast responses</span>
								<button id="mcSpeed" class="mc-toggle" type="button" role="switch" aria-checked="false" disabled title="The local runtime has no speed lane yet — this toggle activates when one lands."></button>
							</div>
							<div class="mc-note">Speed arrives with the runtime's fast lane — not wired yet.</div>
						</div>
					</div>
					<button id="sendBtn" class="composer-send" data-active="false" onclick="sendPrompt()" title="Send">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6.5 10.5L12 5l5.5 5.5"/></svg>
					</button>
				</div>
			</div>
		</div>
	</div>
	<div id="view-surfacewrap">
		<iframe id="view-surface"></iframe>
		<div id="sidechatHandle" class="paneHandle" title="Drag to resize the chat"></div>
		<aside id="sidechat">
			<div id="sidechat-head">
				<span id="sidechat-title">Chat</span>
				<button class="catBtn" onclick="newSidechat()" title="New chat on this surface">+</button>
				<button class="catBtn" onclick="toggleSidechat(false)" title="Collapse">›</button>
			</div>
			<!-- #view-chat docks here while the sidechat is open -->
		</aside>
		<button id="sidechatTab" onclick="toggleSidechat(true)" title="Talk to the controller about this surface">Chat</button>
	</div>
	<div id="view-panel"></div>
	<div id="status"></div>
</main>
</div>
<div id="settingsView">
	<nav>
		<button onclick="closeSettings()">← Back</button>
		<h1 style="margin:10px 0 4px">Settings</h1>
		<button class="stab" data-tab="general" onclick="openSettings('general')">General</button>
		<button class="stab" data-tab="app" onclick="openSettings('app')">App</button>
		<button class="stab" data-tab="authority" onclick="openSettings('authority')">Authority</button>
		<button class="stab" data-tab="connections" onclick="openSettings('connections')">Connections</button>
		<button class="stab" data-tab="profile" onclick="openSettings('profile')">Profile</button>
		<button class="stab" data-tab="cloud" onclick="openSettings('cloud')">Cloud</button>
		<button class="stab" data-tab="advanced" onclick="openSettings('advanced')">Advanced</button>
	</nav>
	<div id="settingsContent"></div>
</div>
<script src="./marked.umd.js"></script>
<script src="./renderer.js"></script>
</body>
</html>
