<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<title>Your browser profile cleanup</title><link rel="stylesheet" href="company-computer.css"><script src="browser-recovery.js" type="module"></script></head>
<body><header><h1>Your browser profile cleanup</h1><button id="refresh" type="button">Refresh</button></header>
<p>Finish a private sign-in or revoke an agent’s consent for a profile you own, including after leaving a company. This window does not open private screens or grant new access.</p>
<p id="status" role="status" aria-live="polite">Loading your profiles…</p>
<label for="office">Computer with your profiles</label> <select id="office"></select> <button id="moreOffices" type="button" hidden>Next computers</button>
<p id="company"></p><section><h2>Private sign-in</h2><p id="privacy" role="status"></p><button id="finish" type="button" disabled>Finish private sign-in and resume shared access</button></section>
<section><h2>Profile consent</h2><label for="profile">Your profile</label> <select id="profile"></select> <button id="moreProfiles" type="button" hidden>Next profiles</button>
<p id="consent" role="status"></p><button id="revoke" type="button" disabled>Revoke this agent’s consent</button></section></body></html>
