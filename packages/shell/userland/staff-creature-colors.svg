<svg xmlns="http://www.w3.org/2000/svg">
	<defs>
		<filter id="charcoal" color-interpolation-filters="sRGB">
			<feFlood flood-color="#171716" result="color"/>
			<feComposite in="color" in2="SourceAlpha" operator="in"/>
		</filter>
		<filter id="brown" color-interpolation-filters="sRGB">
			<feFlood flood-color="#9c7151" result="color"/>
			<feComposite in="color" in2="SourceAlpha" operator="in"/>
