<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'" />
		<title>Company File</title>
		<link rel="stylesheet" href="company-file.css" />
		<script src="company-file.js" defer></script>
	</head>
	<body>
		<header><div><h1 id="title">Company File</h1><p>Live cloud state. Files are read and saved through company permissions.</p></div><button id="recovery" type="button">Cloud recovery</button><button id="refresh" type="button">Refresh</button></header>
		<p id="status" role="status" aria-live="polite">Connecting…</p>
		<main>
			<aside aria-label="Company File navigation">
				<div class="toolbar"><button id="up" type="button">Up</button><button id="newFile" type="button">New file</button><button id="newFolder" type="button">New folder</button></div>
				<h2 id="directory">Company root</h2><div id="paths"></div><button id="morePaths" type="button" hidden>More files</button>
				<h2>Pending changes</h2><div id="reviews"></div><button id="moreReviews" type="button" hidden>More changes</button>
			</aside>
			<section id="editor" aria-label="File editor">
				<label for="path">Company path</label><div class="path-row"><input id="path" autocomplete="off" placeholder="documents/plan.md" /><button id="open" type="button">Open</button></div>
				<label for="content">UTF-8 text <span id="size">0 / 32 KiB</span></label><textarea id="content" spellcheck="false" disabled aria-label="File content"></textarea>
				<div class="toolbar"><button id="save" type="button" disabled>Save to company</button><button id="delete" type="button" disabled>Delete…</button><span id="version">Select a file.</span></div>
				<p class="hint">A save is applied to the live company only if the file version and your permissions still match. Protected changes require review.</p>
			</section>
			<section id="reviewPanel" aria-label="Review exact change" hidden>
				<h2 id="reviewTitle">Review change</h2><p id="reviewPath"></p>
				<div class="comparison"><label>Current<textarea id="before" readonly spellcheck="false"></textarea></label><label>Proposed<textarea id="after" readonly spellcheck="false"></textarea></label></div>
				<div class="toolbar"><button id="approve" type="button">Apply exact change…</button><button id="skip" type="button">Skip change</button><button id="back" type="button">Back to files</button></div>
			</section>
		</main>
	</body>
</html>
