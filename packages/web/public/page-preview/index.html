<!doctype html>
<!-- The frame an HTML page from the Company File runs in (src/ui/page-frame.ts). Its frame and public/_headers
     sandbox it with no origin, so the page reaches none of this site's cookies, storage or sign-in. This policy lets
     the page's own inline styles and scripts run and loads nothing from the network; eval adds nothing a page's own
     scripts can't do in here, and some inlined libraries need it. No browser lets a policy stop WebRTC, so before the
     page runs its WebRTC interfaces go, and a frame put into the page goes before it loads (a frame would be a window of
     its own, with them). The frame waits for its page from the app that framed it, then becomes that page. Escape
     pressed in the page (and not taken by it) is passed to the app, which has no other way to hear a key pressed in
     here: it closes what the page is shown in, as Escape does everywhere else. An interface app's page is handed one
     message port with it, which only this document holds: its `qorpera` object reads the company's data through it,
     and asks for a change, which the app makes only when the member allows it outside this frame; and a link the
     member clicks in the page goes to the app over it, which opens what it allows: the frame follows no link itself. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval' blob:; style-src 'unsafe-inline' data:; img-src data: blob:; font-src data: blob:; media-src data: blob:; connect-src data: blob:; worker-src blob: data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page</title>
<script>
"use strict";
(() => {
	// Only a frame shows a page, and only the one its own app hands it.
	if (window.parent === window) return;
	const app = window.parent;
	// Every function used below is taken now, before the page runs, so the page can't change what it does.
	const apply = Reflect.apply;
	const define = (target, name, value) =>

	const addedNodes = getter(MutationRecord.prototype, "addedNodes");

	const withinFragment = DocumentFragment.prototype.querySelectorAll;

	const attribute = Element.prototype.getAttribute;
	const attributeNS = Element.prototype.getAttributeNS;
	const setAttribute = Element.prototype.setAttribute;
	const setAttributeNS = Element.prototype.setAttributeNS;
	const removeAttribute = Element.prototype.removeAttribute;
	const removeAttributeNS = Element.prototype.removeAttributeNS;

	const linkOf = WeakMap.prototype.get;
	const setLink = WeakMap.prototype.set;
	const removeLink = WeakMap.prototype.delete;

			if (own !== null) {

					call(logError, consoleOf, [
						`Qorpera: a module worker of ${Math.ceil(((data.length - 28) * 3) / 4096)} KiB is too large to start here (at most 1,532 KiB)`,
					]);

			return new Real(make(new BlobOf([body], { type: "text/javascript" })), options);
		};

		Object.defineProperty(Real.prototype, "constructor", { value: started, writable: false, configurable: false });

	// into the page or into a shadow tree, before it loads: the document and every shadow root are watched from the
	// start. A shadow root is only ever made by attachShadow (watched at once, and never cloned along with its host);
	// the ways to make one from markup are gone: the app takes declarative shadow roots out of the page it hands over,
	// and the page can't write into its own parse (a write could start a template the rest of the page finishes).
	const frames = "iframe, frame, object, embed, portal, fencedframe";
	const each = (list, act) => {
		for (let index = apply(count, list, []) - 1; index >= 0; index--) act(apply(item, list, [index]));

		const type = apply(nodeType, node, []);
		if (type === 1 && apply(matches, node, [frames])) apply(remove, node, []);
		else if (type === 1) each(apply(within, node, [frames]), (inner) => apply(remove, inner, []));
		else if (type === 11) each(apply(withinFragment, node, [frames]), (inner) => apply(remove, inner, []));
	};
	let seenFiles = null;
	const watcher = new MutationObserver((records) => {
		for (let index = 0; index < records.length; index++) each(apply(addedNodes, records[index], []), strip);
		if (seenFiles)
			for (let index = 0; index < records.length; index++) each(apply(addedNodes, records[index], []), seenFiles);
	});
	const watch = (target) => apply(observe, watcher, [target, watching]);
	watch(document);

	// Links (deploy/first-node/RUNTIME-INTERFACE-APPS.md §4). The frame follows no link itself: in an app's page a
	// click on one is stopped, and where it leads goes to the app, which opens what it allows (`follow`, there once
	// an app's page is handed over with its port; without it nothing below does anything).
	// - The link is noted on the click's way down, before any handler of the page has the click: at the window, which
	//   is heard first, and at the root of each shadow tree, where a closed tree's own nodes still show. It is the
	//   innermost link on the click's path, also one around a slot that the clicked node sits in.
	// - The click is settled when the page's handlers are done with it, and by what the browser itself then says of
	//   it: a click a handler took, in any way a handler can, is the page's. Nothing the page reads or says of a
	//   click is changed for that. The frame is heard behind the page's handlers: at the window, for a click that
	//   travels all the way, and on every node of the click's path, each way, for a click a handler stops there.
	//   Those listeners are put last again at every click, so a handler the page added since still comes first.
	// - A handler that stops the click at once (stopImmediatePropagation) keeps every later listener from it, and so
	//   do the two places where the frame cannot be behind the page's handlers in time: the window on the click's
	//   way down, and a closed shadow tree's root on the way down. A click stopped so is settled when the handler
	//   that stopped it returns (each handler of a real click runs on an empty stack, so that is before the browser
	//   acts on the click).
	// - Settling a click the page left alone keeps the browser from following the link, and sends where it leads once
	//   the click is over. A click settled while a passive handler has it cannot be stopped; the link's address is
	//   taken out of the link for as long as the click lasts instead (`park`).
	// - A click a script made opens nothing: it is stopped on its way down, and never sent.
	const links = "a[*|href], area[href]";
	const clicked = new WeakMap();
	const settled = new WeakSet();
	const stops = new WeakSet();
	const closed = new WeakSet();
	let follow = null;
	const isLink = (node) => {
		try {
			return apply(nodeType, node, []) === 1 && apply(matches, node, [links]);
		} catch {
			// The window is on the path too, and is no node.
			return false;
		}
	};
	// A jump inside the page (#…) is the page's own, like any click its scripts handle, and a javascript: address is
	// the browser's to run or not, as before (Chromium runs none in this frame): neither is a place to go. Read as the
	// browser reads an address: what it skips in front is skipped, and the scheme counts in any case.
	const ownLink = (href) => {
		let at = 0;
		while (apply(codeAt, href, [at]) <= 32) at++;
		if (apply(codeAt, href, [at]) === 35) return true;
		const scheme = "javascript";
		for (let index = 0; index < 10; index++)
			if ((apply(codeAt, href, [at + index]) | 32) !== apply(codeAt, scheme, [index])) return false;
		return apply(codeAt, href, [at + 10]) === 58;
	};

	const older = "http://www.w3.org/1999/xlink";
	const placeOf = (link) => {
		let href = apply(attribute, link, ["href"]);
		if (href === null) href = apply(attributeNS, link, [older, "href"]);
		return typeof href === "string" && !ownLink(href) ? href : null;
	};
	// A click that a passive handler has at the moment cannot be stopped by anyone, the frame included. The link is
	// then kept from leading anywhere while the click ends: its address is taken out of it, and put back once the
	// click is over, unless the page has written one meanwhile.
	const park = (link) => {
		const plain = apply(attribute, link, ["href"]);
		const drawn = apply(attributeNS, link, [older, "href"]);
		if (plain !== null) apply(removeAttribute, link, ["href"]);
		if (drawn !== null) apply(removeAttributeNS, link, [older, "href"]);
		apply(later, window, [
			() => {
				if (plain !== null && apply(attribute, link, ["href"]) === null) apply(setAttribute, link, ["href", plain]);
				if (drawn !== null && apply(attributeNS, link, [older, "href"]) === null)
					apply(setAttributeNS, link, [older, "xlink:href", drawn]);
			},
			0,
		]);
	};
	// Once for each click, when the page's handlers are done with it.
	const settle = (click) => {
		const link = apply(linkOf, clicked, [click]);
		if (!link || apply(inSet, settled, [click])) return;
		apply(addTo, settled, [click]);
		// A click the page took is the page's, and one that stays in the page is the browser's.
		const href = apply(prevented, click, []) ? null : placeOf(link);
		if (href === null) return;
		apply(prevent, click, []);
		if (!apply(prevented, click, [])) park(link);
		// Only a click the member made goes on, once it is over, to where the link led when it was settled.
		if (click.isTrusted === true && href.length <= 2048) apply(later, window, [() => follow(href), 0]);
	};
	// Heard behind the page's handlers on each node of the click's path: where one of them has stopped the click,
	// no node after this one hears it, so this is where it is settled.
	const settleStopped = (click) => {
		if (apply(inSet, stops, [click]) || (bubble && apply(bubble.get, click, []) === true)) settle(click);
	};
	const last = (node, listener, down) => {
		apply(unlisten, node, ["click", listener, down]);
		apply(listen, node, ["click", listener, down]);
	};
	const noteLink = (click) => {
		if (!follow) return;
		let link = null;
		let path;
		try {
			path = apply(composedPath, click, []);
			for (let index = 0; index < path.length && !link; index++) if (isLink(path[index])) link = path[index];
		} catch {}
		if (!link) return;
		apply(setLink, clicked, [click, link]);
		// A click a script made: stopped here and now, wherever it would travel, and no listener is moved for it (it
		// may run inside a real click, whose listeners are being heard).
		if (click.isTrusted !== true) {
			if (placeOf(link) !== null) apply(prevent, click, []);
			return;
		}
		// Not on the node that is hearing this very listener, on the way down: a listener put there now is not heard
		// for this click (`unheard`).
		const here = apply(currentOf, click, []);
		for (let index = 0; index < path.length; index++) {
			try {
				if (path[index] !== here) last(path[index], settleStopped, true);
				last(path[index], settleStopped, false);

	const hear = (click) => {
		noteLink(click);
		if (click.isTrusted === true) last(window, settle, false);
	};
	// The ways a handler stops a click from travelling on. They do what they did. A link's click that no listener of
	// the frame will hear after the handler that stopped it is settled when that handler returns, or at once when a
	// script made the click (its handlers do not run on an empty stack).

		apply(phaseOf, event, []) === 1 &&
		(apply(currentOf, event, []) === window || apply(inSet, closed, [apply(currentOf, event, [])]));

		if (!apply(linkOf, clicked, [event]) || apply(inSet, settled, [event])) return;

		stopping(this, false);
		apply(stop, this, []);
	};

		stopping(this, true);
		apply(stopNow, this, []);

		Object.defineProperty(Event.prototype, "cancelBubble", {
			configurable: true,
			enumerable: true,

		const root = apply(attachShadow, this, [options]);
		watch(root);

	});

		[Element.prototype, "setHTMLUnsafe"],
		[ShadowRoot.prototype, "setHTMLUnsafe"],
		[Element.prototype, "setHTML"],
		[ShadowRoot.prototype, "setHTML"],
		[Document, "parseHTMLUnsafe"],
		[Document, "parseHTML"],

	});

	const all = Promise.all.bind(Promise);
	const then = Promise.prototype.then;
	const BlobOf = Blob;
	const ResponseOf = Response;
	const RequestOf = Request;
	const AudioOf = Audio;
	const WeakMapOf = WeakMap;
	const makeUrl = URL.createObjectURL;
	const dropUrl = URL.revokeObjectURL;
	const arrayBufferOf = Blob.prototype.arrayBuffer;
	const blobType = getter(Blob.prototype, "type");
	const blobSize = getter(Blob.prototype, "size");
	const requestUrl = getter(Request.prototype, "url");
	const requestMethod = getter(Request.prototype, "method");

	const parentOf = getter(Node.prototype, "parentElement");
	const nameOf = getter(Element.prototype, "localName");
	const hasAttribute = Element.prototype.hasAttribute;
	const toText = String;
	const upper = String.prototype.toUpperCase;
	const lower = String.prototype.toLowerCase;
	const startsWith = String.prototype.startsWith;
	const sliceText = String.prototype.slice;
	const trimStart = String.prototype.trimStart;
	const replaceText = String.prototype.replace;
	const testOf = RegExp.prototype.test;
	const logError = console.error;
	const consoleOf = console;
	const Near = IntersectionObserver;
	const observeNear = IntersectionObserver.prototype.observe;
	const unobserveNear = IntersectionObserver.prototype.unobserve;
	const entryTarget = getter(IntersectionObserverEntry.prototype, "target");
	const entryNear = getter(IntersectionObserverEntry.prototype, "isIntersecting");
	const frameFolder = new URL("./", location.href).href;
	const SCHEME = /^[a-z][a-z0-9+.-]*:/i;
	const TOKEN = /qorpera-file-[0-9a-f]{32}-[a-z0-9]*/g;
	const said = (text) => {
		try {
			apply(logError, consoleOf, [`Qorpera: ${text}`]);
		} catch {}
	};
	const ownPath = (value) => {
		let text;
		try {
			text = apply(trimStart, toText(value), []);
		} catch {
			return null;
		}
		if (apply(startsWith, text, [frameFolder])) text = apply(sliceText, text, [frameFolder.length]);
		else if (apply(testOf, SCHEME, [text]) || apply(startsWith, text, ["/"])) return null;
		return text === "" ? null : text;
	};

	// An interface app's live data (deploy/first-node/RUNTIME-INTERFACE-APPS.md §5) comes over the one port the app hands
	// over with the page: kept in here, never on the page's reach, so only this document's own window ever talks to the
	// app, and a document the frame later shows has none. The page gets a frozen `qorpera` object whose calls go out on
	// it; the app checks each. A call that asks for a change (answer, setRow, addRow) or a note (tell) changes and sends
	// nothing here: the app shows the member what it would save or send, outside this frame, and the promise settles
	// once the member chose. A link the
	// member clicked goes out on it too (`follow`), from this document alone: the page's object has no call for it.
	// A question of the company's databases the page watches (`watch`) is asked once and its listener called with the
	// answer; the app then sends each new answer with the watch's id, and only that watch's listener hears it. The
	// platform's own numbers are asked the same way, as questions of the database `qorpera` (`qorpera/money-now`): the
	// app asks them again on its own clock and sends only an answer that changed, with a watch id below zero. Its
	// answers are handled here with plain callbacks, never a promise, so nothing the page changes on Promise or Object
	// stands between an answer and its listener. A watch the app refuses to start calls the page's `failed`, when it
	// gave one, once with the app's words; what goes wrong after a watch started is not shown (the page keeps what it
	// shows).
	const send = MessagePort.prototype.postMessage;
	// An event's data is read with the browser's own getter: a page that redefines it would be handed the event, and
	// through it the port.
	const dataOf = getter(MessageEvent.prototype, "data");
	const startPort = MessagePort.prototype.start;
	const freeze = Object.freeze;
	const PromiseOf = Promise;
	const ErrorOf = Error;
	const bridge = (port, base) => {
		const pending = new Map();
		const changes = [];
		const watchers = new Map();
		let next = 0;
		const get = Map.prototype.get;
		const set = Map.prototype.set;
		const drop = Map.prototype.delete;
		const push = Array.prototype.push;
		apply(listen, port, [
			"message",
			function answer(event) {
				const data = apply(dataOf, event, []);
				if (!data || typeof data !== "object") return;
				if (data.type === "qorpera-app-change") {
					for (let index = 0; index < changes.length; index++)
						try {
							changes[index]();
						} catch {}
					return;
				}
				if (data.type === "qorpera-app-data") {
					const listener = apply(get, watchers, [data.watch]);
					if (listener)
						try {
							listener(data.value);
						} catch {}
					return;
				}
				if (data.type !== "qorpera-app-answer") return;
				const waiting = apply(get, pending, [data.id]);
				if (!waiting) return;
				apply(drop, pending, [data.id]);
				if (data.ok === true) waiting[0](data.value);
				else waiting[1](new ErrorOf(typeof data.error === "string" ? data.error : "The app could not read that"));
			},
		]);
		apply(startPort, port, []);
		const call = (method, params) =>
			new PromiseOf((resolve, reject) => {
				const id = ++next;
				apply(set, pending, [id, [resolve, reject]]);
				apply(send, port, [{ type: "qorpera-app-call", id, method, params }]);
			});
		// A call answered to plain callbacks. One that can't be sent (its values can't be copied) is answered at once.
		const ask = (method, params, done, failed) => {
			const id = ++next;
			apply(set, pending, [id, [done, failed]]);
			try {
				apply(send, port, [{ type: "qorpera-app-call", id, method, params }]);
			} catch {

		const nothing = () => {};
		const files = new Map();
		const urls = new WeakMap();
		const readFile = (path, from) =>
			new PromiseOf((resolve, reject) =>
				ask(
					"file",
					{ path, base: from },
					(value) => (value instanceof BlobOf ? resolve(value) : reject(new ErrorOf("The app could not read that"))),
					reject,
				),

		const fileOf = (path, from) => {
			const key = `${from}\n${path}`;

				apply(set, files, [key, known]);

					() => {

		};
		const fileUrl = (path, from) => apply(then, fileOf(path, from), [urlOf]);
		const watchQuestion = (name, params, listener, failed) => {
			let stopped = false;
			let id = null;
			if (typeof listener === "function")
				ask(
					"watch",
					{ name: String(name), params: params === undefined ? {} : params },
					(started) => {
						const watching = started && typeof started === "object" ? started.watch : null;
						if (typeof watching !== "number") return;
						if (stopped) {
							ask("unwatch", { watch: watching }, nothing, nothing);
							return;
						}
						id = watching;
						apply(set, watchers, [id, listener]);
						try {
							listener(started.answer);
						} catch {}
					},
					(error) => {
						if (stopped) return;
						stopped = true;
						if (typeof failed === "function")
							try {
								failed(error);
							} catch {}
					},
				);
			return freeze(() => {
				if (stopped) return;
				stopped = true;
				if (id === null) return;
				apply(drop, watchers, [id]);
				ask("unwatch", { watch: id }, nothing, nothing);
			});
		};
		const page = freeze({
			read: freeze((path) => call("read", { path: String(path) })),
			list: freeze((path) => call("list", { path: path === undefined ? "" : String(path) })),
			table: freeze((name) => call("table", { name: String(name) })),
			todos: freeze(() => call("todos", {})),
			agents: freeze(() => call("agents", {})),
			// The company's reading of itself, its agents and whether it can run, as plain names (app/company-reading.ts).
			reading: freeze(() => call("reading", {})),
			questions: freeze(() => call("questions", {})),
			answer: freeze((id, value) => call("answer", { id: String(id), value })),
			setRow: freeze((table, key, cells) => call("setRow", { table: String(table), key, cells })),
			addRow: freeze((table, cells) => call("addRow", { table: String(table), cells })),
			query: freeze((name, params) => call("query", { name: String(name), params: params === undefined ? {} : params })),
			act: freeze((name, params) => call("act", { name: String(name), params: params === undefined ? {} : params })),
			watch: freeze(watchQuestion),
			// A note to the app's owner, about a thing in the app: the member writes it on the app's bar, where `text` is
			// only the draft they start from.
			tell: freeze((note) => {
				const given = note !== null && typeof note === "object" ? note : {};
				const kept = (value) => (value === undefined || value === null ? null : String(value));
				return call("tell", { about: String(given.about ?? ""), at: kept(given.at), text: kept(given.text) });
			}),
			file: freeze((path) => fileUrl(String(path), base)),
			bytes: freeze((path) => apply(then, readFile(String(path), base), [(blob) => apply(arrayBufferOf, blob, [])])),
			onChange: freeze((listener) => {
				if (typeof listener === "function") apply(push, changes, [listener]);
			}),

		// Sent as a call, so the app counts it as one; nothing here waits for its answer.
		const follow = (href) =>
			apply(send, port, [{ type: "qorpera-app-call", id: ++next, method: "open", params: { href } }]);
		return { page, follow, fileUrl, readFile };
	};

	const ownFiles = (live, base) => {
		const pending = new WeakMapOf();
		const fail = (path) => (error) =>
			said(`${path} could not be loaded: ${error && typeof error.message === "string" ? error.message : "it could not be read"}`);
		const NAMES = ["src", "poster", "href"];
		const WAITING = "[data-qorpera-src], [data-qorpera-poster], [data-qorpera-href]";
		const later = (element) => {
			const loads = [];
			for (let index = 0; index < NAMES.length; index++) {
				const name = NAMES[index];
				const path = apply(attribute, element, [`data-qorpera-${name}`]);
				if (path === null) continue;
				apply(removeAttribute, element, [`data-qorpera-${name}`]);
				loads[loads.length] = apply(then, live.fileUrl(path, ""), [
					(url) => apply(setAttribute, element, [name, url]),
					fail(path),
				]);
			}
			return loads;
		};
		const isMedia = (element) => {
			const name = apply(nameOf, element, []);
			return name === "video" || name === "audio";
		};
		const waits = (element) =>
			apply(matches, element, [WAITING]) || apply(count, apply(within, element, [WAITING]), []) > 0;
		const bring = (element) => {
			const loads = later(element);
			if (isMedia(element))
				each(apply(within, element, ["source, track"]), (inner) => {
					const more = later(inner);
					for (let index = 0; index < more.length; index++) loads[loads.length] = more[index];
				});
			const done = apply(then, all(loads), [
				() => {
					if (isMedia(element) && loads.length) apply(mediaLoad, element, []);
				},
			]);
			apply(setLink, pending, [element, done]);
			return done;
		};
		const near = new Near(
			(entries) => {
				for (let index = 0; index < entries.length; index++) {
					if (!apply(entryNear, entries[index], [])) continue;
					const element = apply(entryTarget, entries[index], []);
					apply(unobserveNear, near, [element]);
					bring(element);
				}
			},
			{ rootMargin: "100% 0px 100% 0px" },
		);
		const take = (element) => {
			const name = apply(nameOf, element, []);
			const target = name === "source" || name === "track" ? apply(parentOf, element, []) || element : element;
			if (apply(nameOf, target, []) !== "audio" || apply(hasAttribute, target, ["controls"]))
				apply(observeNear, near, [target]);
			else if (apply(hasAttribute, target, ["autoplay"])) bring(target);
		};
		const give = (element, name, path) => {
			const done = apply(then, live.fileUrl(path, base), [
				(url) => apply(setAttribute, element, [name, url]),
				fail(path),
			]);
			apply(setLink, pending, [element, done]);
		};
		const RELATIVE = "img[src], video[src], video[poster], audio[src], source[src], track[src]";
		const fix = (element) => {
			for (const name of ["src", "poster"]) {
				const value = apply(attribute, element, [name]);
				const path = value === null ? null : ownPath(value);
				if (path === null) continue;
				apply(removeAttribute, element, [name]);
				give(element, name, path);
			}
		};
		const seen = (node) => {
			const type = apply(nodeType, node, []);
			if (type !== 1 && type !== 11) return;
			if (type === 1 && apply(matches, node, [WAITING])) take(node);
			if (type === 1 && apply(matches, node, [RELATIVE])) fix(node);
			const inside = type === 1 ? within : withinFragment;
			each(apply(inside, node, [WAITING]), take);
			each(apply(inside, node, [RELATIVE]), fix);
		};
		for (const [prototype, name] of [
			[HTMLImageElement.prototype, "src"],
			[HTMLMediaElement.prototype, "src"],
			[HTMLSourceElement.prototype, "src"],
			[HTMLTrackElement.prototype, "src"],
			[HTMLVideoElement.prototype, "poster"],
		]) {
			const property = Object.getOwnPropertyDescriptor(prototype, name);
			Object.defineProperty(prototype, name, {
				configurable: true,
				enumerable: true,
				get: property.get,
				set(value) {
					const path = ownPath(value);
					if (path === null) apply(property.set, this, [value]);
					else give(this, name, path);
				},
			});
		}
		const loadsFile = (element, name) =>
			name === "src"
				? element instanceof HTMLImageElement ||
					element instanceof HTMLMediaElement ||
					element instanceof HTMLSourceElement ||
					element instanceof HTMLTrackElement
				: name === "poster" && element instanceof HTMLVideoElement;
		Element.prototype.setAttribute = function setAttributeOwn(name, value) {
			const named = apply(lower, toText(name), []);
			const path = loadsFile(this, named) ? ownPath(value) : null;
			if (path === null) return apply(setAttribute, this, [name, value]);
			give(this, named, path);
		};
		window.Audio = function Audio(source) {
			const made = new AudioOf();
			if (source !== undefined) made.src = source;
			return made;
		};
		window.Audio.prototype = AudioOf.prototype;
		HTMLMediaElement.prototype.play = function play() {
			const ready = apply(linkOf, pending, [this]) || (waits(this) ? bring(this) : null);
			return ready ? apply(then, ready, [() => apply(mediaPlay, this, [])]) : apply(mediaPlay, this, []);
		};
		HTMLMediaElement.prototype.load = function load() {
			if (waits(this)) bring(this);
			else apply(mediaLoad, this, []);
		};
		window.fetch = function fetch(input, init) {
			let address;
			let method = "GET";
			try {
				if (input instanceof RequestOf) {
					address = apply(requestUrl, input, []);
					method = apply(requestMethod, input, []);
				} else address = toText(input);
				if (init && init.method !== undefined) method = apply(upper, toText(init.method), []);
			} catch {
				return apply(realFetch, window, [input, init]);
			}
			const path = method === "GET" || method === "HEAD" ? ownPath(address) : null;
			if (path === null) return apply(realFetch, window, [input, init]);
			return new PromiseOf((resolve) =>
				apply(then, live.readFile(path, base), [
					(blob) =>
						resolve(
							new ResponseOf(method === "HEAD" ? null : blob, {
								status: 200,
								statusText: "OK",
								headers: {
									"content-type": apply(blobType, blob, []) || "application/octet-stream",
									"content-length": toText(apply(blobSize, blob, [])),

				apply(xhrOpen, this, [request.verb, address, true]);
				for (let index = 0; index < request.headers.length; index++) apply(xhrHeader, this, request.headers[index]);
				if (request.mime !== null) apply(xhrMime, this, [request.mime]);
				apply(xhrSend, this, []);
			};
			apply(then, live.readFile(request.path, base), [
				(blob) => {
					const address = makeUrl(blob);
					apply(listen, this, ["loadend", () => dropUrl(address)]);
					go(address);
				},
				(error) => {
					fail(request.path)(error);
					const gone = makeUrl(new BlobOf([]));
					dropUrl(gone);
					go(gone);
				},
			]);
		};
		return seen;
	};

	addEventListener("message", function take(event) {
		const data = event.data;
		if (event.source !== app || !data || data.type !== "qorpera-page" || typeof data.html !== "string") return;
		removeEventListener("message", take);
		const port = event.ports && event.ports.length === 1 ? event.ports[0] : null;
		const base = typeof data.base === "string" ? data.base : "";
		const live = port ? bridge(port, base) : null;
		const handed = new Map();
		if (Array.isArray(data.files))
			for (const pair of data.files)
				if (Array.isArray(pair) && typeof pair[0] === "string" && pair[1] instanceof BlobOf)
					handed.set(pair[0], makeUrl(pair[1]));
		const html = handed.size ? data.html.replace(TOKEN, (token) => handed.get(token) ?? token) : data.html;
		if (Array.isArray(data.missing))
			for (const path of data.missing)
				if (typeof path === "string") said(`${path} is not in the page's folder, so the page shows without it`);
		if (Array.isArray(data.said)) for (const line of data.said) if (typeof line === "string") said(line);
		apply(open, document, []);
		if (live) {
			seenFiles = ownFiles(live, base);
			define(window, "qorpera", live.page);
			// Only for a page handed a port (an app's; the app refuses the links of any other page it hands one).
			// Listened for now: after the document is opened, which drops the window's listeners, and before the page
			// is written, so before any listener of the page's.
			follow = live.follow;
			apply(listen, window, ["click", hear, true]);
		}
		apply(write, document, [html]);
		apply(close, document, []);
		// Added once the page is written (opening the document drops the window's listeners). Passed on only after every
		// handler of the page has had the key, also one it adds later: a page that takes Escape for itself (its own
		// menu) keeps it.
		apply(listen, window, [
			"keydown",
			function passEscape(pressed) {
				if (apply(keyOf, pressed, []) !== "Escape" || apply(composing, pressed, [])) return;
				apply(later, window, [
					function afterPage() {
						if (!apply(prevented, pressed, [])) app.postMessage({ type: "qorpera-page-escape" }, "*");
					},
					0,
				]);
			},
		]);
	});
	app.postMessage({ type: "qorpera-page-ready" }, "*");
})();
</script>
