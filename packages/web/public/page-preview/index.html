<!doctype html>
<!-- The frame an HTML page from the Company File runs in (src/ui/page-frame.ts). Its frame and public/_headers
     sandbox it with no origin, so the page reaches none of this site's cookies, storage or sign-in. This policy lets
     the page's own inline styles and scripts run and loads nothing from the network; eval adds nothing a page's own
     scripts can't do in here, and some inlined libraries need it. No browser lets a policy stop WebRTC, so before the
     page runs its WebRTC interfaces go, and a frame put into the page goes before it loads (a frame would be a window of
     its own, with them). The frame waits for its page from the app that framed it, then becomes that page. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval'; style-src 'unsafe-inline' data:; img-src data: blob:; font-src data:; media-src data: blob:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page</title>
<script>
"use strict";
(() => {
	// Only a frame shows a page, and only the one its own app hands it.
	if (window.parent === window) return;
	const app = window.parent;
	// WebRTC reaches the network whatever the policy says (STUN and TURN servers, and the names they are given), so its
	// interfaces are gone for good before the page runs.
	for (const name of Object.getOwnPropertyNames(window))
		if (/^(?:webkit|moz)?RTC/.test(name))
			Object.defineProperty(window, name, { value: undefined, writable: false, configurable: false });
	// A frame inside the page would be a window of its own, with WebRTC: each one is taken out as soon as it is put in,
	// before it loads. The page can't undo this: every function used here is taken now, before the page runs.
	const apply = Reflect.apply;
	const getter = (prototype, name) => Object.getOwnPropertyDescriptor(prototype, name).get;
	const nodeType = getter(Node.prototype, "nodeType");
	const addedNodes = getter(MutationRecord.prototype, "addedNodes");
	const count = getter(NodeList.prototype, "length");
	const item = NodeList.prototype.item;
	const matches = Element.prototype.matches;
	const within = Element.prototype.querySelectorAll;
	const remove = Element.prototype.remove;
	const frames = "iframe, frame, object, embed, portal, fencedframe";
	const each = (list, act) => {
		for (let index = apply(count, list, []) - 1; index >= 0; index--) act(apply(item, list, [index]));
	};
	const strip = (node) => {
		if (apply(nodeType, node, []) !== 1) return;
		if (apply(matches, node, [frames])) apply(remove, node, []);
		else each(apply(within, node, [frames]), (inner) => apply(remove, inner, []));
	};
	new MutationObserver((records) => {
		for (let index = 0; index < records.length; index++) each(apply(addedNodes, records[index], []), strip);
	}).observe(document, { childList: true, subtree: true });
	addEventListener("message", function take(event) {
		const data = event.data;
		if (event.source !== app || !data || data.type !== "qorpera-page" || typeof data.html !== "string") return;
		removeEventListener("message", take);
		document.open();
		document.write(data.html);
		document.close();
	});
	app.postMessage({ type: "qorpera-page-ready" }, "*");
})();
</script>
</head>
<body></body>
</html>
