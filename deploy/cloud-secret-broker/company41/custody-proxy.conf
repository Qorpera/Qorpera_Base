worker_processes 1;
pid /run/qorpera-custody-proxy/nginx.pid;
error_log stderr crit;

events {
	worker_connections 64;
}

http {
	access_log off;
	server_tokens off;
	client_body_temp_path /var/cache/qorpera-custody-proxy/client;
	proxy_temp_path /var/cache/qorpera-custody-proxy/proxy;
	client_max_body_size 96k;
	client_body_buffer_size 96k;
	client_body_timeout 10s;
	proxy_connect_timeout 3s;
	proxy_send_timeout 40s;
	proxy_read_timeout 40s;
	proxy_http_version 1.1;
	proxy_set_header Host localhost;
	proxy_set_header Connection close;
	proxy_set_header X-Forwarded-For "";
	proxy_set_header X-Forwarded-Proto "";
	proxy_request_buffering on;
	proxy_buffering on;
	add_header Cache-Control no-store always;

	server {
		# Company41's retained broker tailnet address; no wildcard/public listener.
		listen 100.65.132.47:8443 ssl;
		ssl_protocols TLSv1.3;
		ssl_certificate /run/credentials/qorpera-cloud-custody-proxy.service/qorpera-cloud-custody-tls-cert;
		ssl_certificate_key /run/credentials/qorpera-cloud-custody-proxy.service/qorpera-cloud-custody-tls-key;
		ssl_session_cache off;

		location ~ "^/v1/(operations|captures/[0-9a-f-]{36})$" {
			limit_except POST { deny all; }
			proxy_pass http://127.0.0.1:9080;
		}

		location ~ "^/v1/(backup/prepare|backup|release|complete)$" {
			limit_except POST { deny all; }
			proxy_pass http://127.0.0.1:18081;
		}

		location / {
			return 404;
		}
	}
}
