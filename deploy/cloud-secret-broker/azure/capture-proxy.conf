worker_processes 1;
pid /run/qorpera-secret-capture-proxy/nginx.pid;
error_log stderr crit;

events {
	worker_connections 64;
}

http {
	access_log off;
	server_tokens off;
	client_body_temp_path /var/cache/qorpera-secret-capture-proxy/client;
	proxy_temp_path /var/cache/qorpera-secret-capture-proxy/proxy;
	client_max_body_size 96k;
	client_body_buffer_size 96k;
	client_body_timeout 10s;
	proxy_connect_timeout 3s;
	proxy_send_timeout 15s;
	proxy_read_timeout 15s;

	server {
		listen 0.0.0.0:8443 ssl;
		ssl_protocols TLSv1.3;
		ssl_certificate /run/credentials/qorpera-cloud-secret-capture-proxy.service/qorpera-step2-canary-tls-cert;
		ssl_certificate_key /run/credentials/qorpera-cloud-secret-capture-proxy.service/qorpera-step2-canary-tls-key;
		ssl_session_cache off;

		location ~ "^/v1/captures/[0-9a-fA-F-]{36}$" {
			limit_except POST { deny all; }
			proxy_pass http://127.0.0.1:9080;
			proxy_http_version 1.1;
			proxy_set_header Host localhost;
			proxy_set_header Connection close;
			proxy_set_header X-Forwarded-For "";
			proxy_set_header X-Forwarded-Proto "";
			proxy_request_buffering on;
			proxy_buffering on;
		}

		# The native operation lane is reachable only from the fixed Step 2 cloud
		# runner egress. Azure NSG independently enforces the same exact source.
		location = /v1/operations {
			allow 2.110.77.200;
			deny all;
			limit_except POST { deny all; }
			proxy_pass http://127.0.0.1:9080;
			proxy_http_version 1.1;
			proxy_set_header Host localhost;
			proxy_set_header Connection close;
			proxy_set_header X-Forwarded-For "";
			proxy_set_header X-Forwarded-Proto "";
			proxy_request_buffering on;
			proxy_buffering on;
		}

		location / {
			return 404;
		}
	}
}
