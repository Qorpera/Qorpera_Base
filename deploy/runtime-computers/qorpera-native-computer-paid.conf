[Unit]
Requires=qorpera-native-computer-guard.service
After=qorpera-native-computer-guard.service

# Install only after reviewed host enrollment and guard acceptance. The
# root-owned credential path is passed to the provider, never to its guests.
[Service]
Environment=QORPERA_NATIVE_COMPUTER_EXECUTOR_SECRET_FILE=/etc/qorpera/native-computer-executor.key
