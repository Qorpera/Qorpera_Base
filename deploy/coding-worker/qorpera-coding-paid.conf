# Reviewed opt-in drop-in for a node with paidComputers:true. Install the
# separate guard unit and enroll only the hash of this host-only credential.
[Unit]
Requires=qorpera-paid-computer-guard.service
After=qorpera-paid-computer-guard.service

[Service]
LoadCredential=qorpera-coding-computer-executor:/etc/qorpera/coding-computer-executor.key
