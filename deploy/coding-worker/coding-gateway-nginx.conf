# The coding executor's TLS front on node 2: /etc/qorpera-coding-gateway/nginx.conf (deploy/guest-guard/README.md,
# "Coding command gateway"). Rendered by scripts/coding-gateway-nginx.mjs, which fills every placeholder.
#
# Until 14 Nov 2026 this file was hand-placed on the node and in no repository or roll phase. This template is
# reconstructed from the node's own read of that day (lanes/agent-box-20261113/home-lxd/front-read.out, nginx 1.28.3):
# the directives that read showed are here as they were; what it did not show (the process's own lines, the TLS
# certificate and key, the value of X-Forwarded-For) comes in as a value to render, to be taken from the node's file.
#
# One change against the node's file: the agent's home (lanes/agent-box-20261113) has a location of its own, the only
# one that passes an HTTP/1.1 Upgrade. Everything else stays as it was: Connection close, 60 s, request buffering on.

@PROCESS@

http {
	@HTTP@

	client_max_body_size 256k;
	proxy_send_timeout 60s;
	proxy_read_timeout 60s;
	proxy_http_version 1.1;
	proxy_set_header Host 127.0.0.1;
	proxy_set_header Connection close;
	proxy_set_header X-Forwarded-For @X_FORWARDED_FOR@;
	proxy_request_buffering on;

	server {
		listen 10.41.0.1:8789 ssl;
		ssl_certificate @TLS_CERTIFICATE@;
		ssl_certificate_key @TLS_CERTIFICATE_KEY@;

		# The agent's home: one run's channel to its machine (packages/runtime/src/cloud-home-channel.ts). The upgrade
		# passes here and nowhere else. A location that sets a header of its own inherits none from above, so Host and
		# X-Forwarded-For are set again. Nothing is buffered either way: the channel's lines must arrive as they are sent.
		# Each end sends a keep-alive line every 20 s while the channel is quiet (CLOUD_HOME_CHANNEL_KEEPALIVE_MS), so a
		# quiet channel stays open under these timeouts, and one whose other end is truly gone ends within 90 s.
		location = /v1/home-session {
			proxy_pass http://127.0.0.1:18789;
			proxy_set_header Host 127.0.0.1;
			proxy_set_header X-Forwarded-For @X_FORWARDED_FOR@;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
			proxy_buffering off;
			proxy_request_buffering off;
			proxy_read_timeout 90s;
			proxy_send_timeout 90s;
		}

		location / {
			proxy_pass http://127.0.0.1:18789;
		}
	}
}
