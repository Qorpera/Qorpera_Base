worker_processes 1;
pid /run/@UNIT@/nginx.pid;
error_log stderr crit;
events { worker_connections 2048; }
http {
	access_log off;
	server_tokens off;
	client_body_temp_path /var/cache/@UNIT@/client;
	proxy_temp_path /var/cache/@UNIT@/proxy;
	fastcgi_temp_path /var/cache/@UNIT@/fastcgi;
	uwsgi_temp_path /var/cache/@UNIT@/uwsgi;
	scgi_temp_path /var/cache/@UNIT@/scgi;
	client_max_body_size 256k;
	client_body_buffer_size 256k;
	client_body_timeout 15s;
	proxy_connect_timeout 3s;
	proxy_send_timeout 60s;
	proxy_read_timeout 60s;
	proxy_http_version 1.1;
	proxy_set_header Host 127.0.0.1;
	proxy_set_header Connection close;
	proxy_set_header X-Forwarded-For "";
	proxy_request_buffering on;
	add_header Cache-Control no-store always;
	server {
@INGRESS@		# Only the guest bridge address; the LAN and the tailnet never see this listener.
@INGRESS@		listen 10.41.0.1:8789 ssl;
@PEER@		# Node 1 coding forward only (tailnet peer); TLS ends here as on the guest listener.
@PEER@		listen 100.80.160.64:8789 ssl;
@PEER@		allow 100.75.4.70;
@PEER@		deny all;
		ssl_protocols TLSv1.3;
		ssl_certificate /run/credentials/@UNIT@.service/gateway.crt;
		ssl_certificate_key /run/credentials/@UNIT@.service/gateway.key;
		ssl_session_cache off;
		location = /v1/home-session {
			# The agent's home channel, the one upgrade (packages/runtime/src/cloud-home-channel.ts). Headers set here
			# replace all the http block's. Each end sends a line every 20 s, so 90 s ends only a channel that is gone.
			limit_except GET { deny all; }
			proxy_pass http://127.0.0.1:18789;
			proxy_set_header Host 127.0.0.1;
			proxy_set_header X-Forwarded-For "";
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
			proxy_buffering off;
			proxy_request_buffering off;
			proxy_read_timeout 90s;
			proxy_send_timeout 90s;
		}
		location / {
			limit_except POST { deny all; }
			proxy_pass http://127.0.0.1:18789;
		}
	}
}
