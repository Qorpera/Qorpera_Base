# Company sites and private app links (deploy/sites/): the front door's changes, for /opt/dbhome/front/envoy-front.yaml
# (the dbhome kit's front/envoy-front.yaml, service api-front). This block replaces that file's `virtual_hosts:` block
# whole, from `virtual_hosts:` to the api host's last route, at the same indentation (18 spaces). App links also need
# the cluster `app_relay` in that file's `clusters:` block: envoy-front-app-relay-cluster.yaml, added after api_gw
# (Envoy refuses a route to a cluster it does not have, so both go in together). Against the file of 3 Nov 2026 it
# changes these things and nothing else:
#  1. A virtual host `sites`, before the api host: every path on sites.qorpera.com goes to the site-serve function
#     (prefix_rewrite /functions/v1/site-serve/), and nothing else of the stack is reachable on that name (no /rest,
#     /auth, /storage, /realtime or other function). It sets x-forwarded-host to the sites host, replacing a visitor's
#     own; the function serves only when that header is exactly the sites host. WebSocket upgrades are off on that route
#     (Envoy answers an upgrade 403 itself).
#  2. On the api host, /functions/v1/site-serve answers 404 (before the functions route), so agent-made sites are never
#     served as api.qorpera.com's origin.
#  3. On the api host, a visitor's x-forwarded-host is dropped and the name the request asked for (its Host) is set in
#     its place, so no request on this name can claim the sites host. That is the value the gateway (api-gw, which only
#     adds the header when it is absent) set before for every request that came without one, so no caller sees a change.
#     A Host that only looks like the sites host (another port, a trailing dot) comes here and is refused by the
#     function, which takes the sites host exactly.
#  4. A virtual host `apps` (APP-PREVIEW.md, section 4): every path on <slug>-preview.qorpera.com goes to the app relay
#     (cluster app_relay, app-relay:8090), WebSocket upgrades too (the link programs' /.qorpera/connect), with no route
#     timeout (the relay answers 504 itself, and keeps its programs' connections alive). x-forwarded-host is the
#     request's own name, a visitor's dropped; the relay serves only names that are a slug and -preview.qorpera.com.
#  5. A virtual host `site-hosts` for every other name under qorpera.com (step 5, release 5.1; SITE-HOSTS.md): a company
#     site's own host <slug>.qorpera.com and its next host <slug>--next.qorpera.com. Every path goes to the site-serve
#     function (prefix_rewrite /functions/v1/site-serve/, as the sites host), with x-forwarded-host the request's own name
#     and a visitor's dropped, and nothing else of the stack is reachable on these names. WebSocket upgrades are off on
#     that route (Envoy answers an upgrade 403 itself). The wildcard DNS name and tunnel rule (sites-route.mjs) bring
#     any such name here; Envoy's *.qorpera.com also takes deeper names and names that are no site, which site-serve
#     answers as no site. Until 5.1 this was a virtual host `others` answering 404 on every path (the way back,
#     SITE-HOSTS.md).
#  6. The api host lists "api.qorpera.com" first; "*" stays for every name outside qorpera.com (the stack's own
#     callers).
#  7. Outside this block, in the same file: the `front` listener's connection manager drops a Host's port and trailing
#     dot before it picks a virtual host, so evil.qorpera.com:8443 or evil.qorpera.com. is evil.qorpera.com (a site
#     host), never the api host's "*", and every x-forwarded-host above is the bare name. The two lines go
#     under that listener's http_connection_manager typed_config, right after `use_remote_address: false`, at its
#     indentation (16 spaces), exactly:
#                strip_any_host_port: true
#                strip_trailing_host_dot: true
# Envoy picks a virtual host by its exact name (letters in any case), then the longest suffix wildcard
# (*-preview.qorpera.com before *.qorpera.com; a wildcard never matches nothing, so -preview.qorpera.com is a site host),
# then "*", whatever the order; the order here only reads that way. Envoy removes the listed headers before it adds, so
# an empty Host leaves no visitor value either.
# Check a new file before it is put in place (in /opt/dbhome; the new file beside the live one, mode 0644):
#   docker compose run --rm --no-deps -v /opt/dbhome/front/envoy-front.yaml.new:/etc/envoy/new.yaml:ro \
#     --entrypoint envoy api-front --mode validate -c /etc/envoy/new.yaml
# Envoy reads its file only when it starts: docker compose up -d --no-deps --force-recreate api-front (SITE-HOSTS.md).
                  virtual_hosts:
                    # Company sites: the site-serve function on every path, no WebSocket, and nothing else of the stack.
                    - name: sites
                      domains: ["sites.qorpera.com"]
                      request_headers_to_add:
                        - header: { key: x-forwarded-host, value: sites.qorpera.com }
                          append_action: OVERWRITE_IF_EXISTS_OR_ADD
                      routes:
                        - { match: { prefix: / }, route: { cluster: api_gw, timeout: 0s, prefix_rewrite: /functions/v1/site-serve/, upgrade_configs: [{ upgrade_type: websocket, enabled: false }] } }
                    # Private app links: the app relay on every path, WebSocket upgrades on, and nothing else of the stack.
                    - name: apps
                      domains: ["*-preview.qorpera.com"]
                      request_headers_to_remove: [x-forwarded-host]
                      request_headers_to_add:
                        - header: { key: x-forwarded-host, value: "%REQ(:AUTHORITY)%" }
                          append_action: OVERWRITE_IF_EXISTS_OR_ADD
                      routes:
                        - { match: { prefix: / }, route: { cluster: app_relay, timeout: 0s, upgrade_configs: [{ upgrade_type: websocket }] } }
                    # Every other name under qorpera.com: a company site's own or next host. The site-serve function on
                    # every path, with the request's own name, no WebSocket, and nothing else of the stack.
                    - name: site-hosts
                      domains: ["*.qorpera.com"]
                      request_headers_to_remove: [x-forwarded-host]
                      request_headers_to_add:
                        - header: { key: x-forwarded-host, value: "%REQ(:AUTHORITY)%" }
                          append_action: OVERWRITE_IF_EXISTS_OR_ADD
                      routes:
                        - { match: { prefix: / }, route: { cluster: api_gw, timeout: 0s, prefix_rewrite: /functions/v1/site-serve/, upgrade_configs: [{ upgrade_type: websocket, enabled: false }] } }
                    - name: api
                      domains: ["api.qorpera.com", "*"]
                      # The API name's own forwarded host: never a visitor's, so never the sites host.
                      request_headers_to_remove: [x-forwarded-host]
                      request_headers_to_add:
                        - header: { key: x-forwarded-host, value: "%REQ(:AUTHORITY)%" }
                          append_action: OVERWRITE_IF_EXISTS_OR_ADD
                      routes:
                        # timeout 0s: the gateway's own route timeouts apply (30 s; functions 160/410 s).
                        - { match: { prefix: /auth/v1/ }, route: { cluster: api_gw, timeout: 0s } }
                        - { match: { prefix: /rest/v1/ }, route: { cluster: api_gw, timeout: 0s } }
                        - { match: { prefix: /graphql/v1 }, route: { cluster: api_gw, timeout: 0s } }
                        - match: { prefix: /storage/v1/ }
                          route: { cluster: api_gw, timeout: 0s }
                          response_headers_to_add:
                            - header: { key: vary, value: Origin }
                              append_action: APPEND_IF_EXISTS_OR_ADD
                        # The functions runtime's own router (main) is not a function; hosted Supabase has no such name.
                        - { match: { path: /functions/v1/main }, direct_response: { status: 404 } }
                        - { match: { prefix: /functions/v1/main/ }, direct_response: { status: 404 } }
                        # Company sites are served only on their own name (the sites host above), never as this origin.
                        - { match: { prefix: /functions/v1/site-serve, case_sensitive: false }, direct_response: { status: 404 } }
                        - { match: { prefix: /functions/v1/ }, route: { cluster: api_gw, timeout: 0s } }
                        - { match: { prefix: /realtime/v1/ }, route: { cluster: api_gw, timeout: 0s } }
                        # Auth's OAuth server metadata at the root, as the gateway and hosted Supabase serve it.
                        - { match: { path: /.well-known/oauth-authorization-server/auth/v1 }, route: { cluster: api_gw, timeout: 0s } }
                        - { match: { prefix: / }, direct_response: { status: 404 } }
