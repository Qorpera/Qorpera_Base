# Private app links (deploy/sites/APP-PREVIEW.md, section 4): the cluster the `apps` virtual host of
# envoy-front-sites.yaml routes to. It goes in /opt/dbhome/front/envoy-front.yaml (the dbhome kit's
# front/envoy-front.yaml, service api-front) under `clusters:`, after the api_gw cluster, at the same indentation
# (4 spaces before `- name:`), together with the virtual hosts block: Envoy refuses either one without the other.
# app-relay is the compose service of deploy/sites/app-relay/compose-service.yml on the same network. The relay keeps
# connections open 75 s, so Envoy closes an idle one first (60 s) and never sends a request on a connection the relay
# has just closed.
    - name: app_relay
      type: STRICT_DNS
      connect_timeout: 5s
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          '@type': type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          common_http_protocol_options: { idle_timeout: 60s }
          explicit_http_config: { http_protocol_options: {} }
      load_assignment:
        cluster_name: app_relay
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: app-relay, port_value: 8090 }
