# /etc/sysctl.d/60-qorpera-coding.conf, in the coding machine's own kernel.
# Every session has root through sudo, so Ubuntu's restriction on unprivileged user
# namespaces protects nothing here; it only breaks honest tools that use them, such
# as Chromium's sandbox, bubblewrap and rootless Podman.
kernel.apparmor_restrict_unprivileged_userns = 0
