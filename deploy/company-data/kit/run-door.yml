# The gateway's run door (README.md, "The run door"), after docker-compose.yml. The kit's scripts add this file to
# COMPOSE_FILE by themselves whenever DATA_RUN_LISTEN is set (lib.sh), and so does compose.sh, which every compose
# command by hand goes through: a machine never names it. Without the setting no run door listens, with it the door is
# published there and nowhere else.
#   DATA_RUN_LISTEN   where the run door's port is published, address:port: on data-primary its qdatahome0 address and
#                     8481, which each node's forward on 10.41.0.1:8481 reaches (lanes: nodework/road-run.md)
# Its secrets are in DATA_LOCAL/secrets/run-door, the gateway's user's (init.sh): the token every provider host brings
# (the systemd credential qorpera-company-data on the nodes), and the run door's TLS key and cert from the kit's CA.
services:
  data-gateway:
    environment:
      DATA_RUN_DOOR: 0.0.0.0:8481
      DATA_RUN_SECRETS: /run/company-data/run-door
    volumes:
      - ${DATA_LOCAL}/secrets/run-door:/run/company-data/run-door:ro
    ports:
      - ${DATA_RUN_LISTEN:?set DATA_RUN_LISTEN}:8481
