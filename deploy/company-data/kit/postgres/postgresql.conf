# The company data store's PostgreSQL (deploy/first-node/RUNTIME-COMPANY-DATABASES.md §2). The whole server
# configuration: docker-compose.yml starts the server with config_file pointing here, so the file initdb writes into
# the data folder is never read. Mounted read-only at /etc/company-data. Settings that differ per machine live in
# /etc/company-data-local (the machine's own folder), included at the end.

listen_addresses = '*'
port = 5432
max_connections = 200

# Memory for a machine of 8 GiB and 2 CPUs that runs this store alone.
shared_buffers = 2GB
effective_cache_size = 5GB
maintenance_work_mem = 256MB
# The gateway's logins set their own work_mem (cluster.sql); this is the default for everything else.
work_mem = 16MB
dynamic_shared_memory_type = posix

# Who may connect: pg_hba.conf. The gateway's logins come from the compose network only, the replication login over
# TLS from the standby's address only, the superuser over the container's socket only.
hba_file = '/etc/company-data/pg_hba.conf'
ident_file = '/etc/company-data/pg_ident.conf'
password_encryption = scram-sha-256

# TLS with the kit's own CA (tls.sh). The standby dials with sslmode=verify-full.
ssl = on
ssl_cert_file = '/etc/company-data-local/tls/server.crt'
ssl_key_file = '/etc/company-data-local/tls/server.key'
ssl_min_protocol_version = 'TLSv1.2'

# WAL. Every finished WAL file goes to /backup/wal (archive-wal.sh), and a WAL file with any change in it is closed at
# least every 60 s, so the archive is at most about a minute behind even when the store is quiet.
wal_level = replica
archive_mode = on
archive_command = '/etc/company-data/archive-wal.sh %p %f'
archive_timeout = 60s
max_wal_senders = 5
max_replication_slots = 5
# A slot keeps WAL for a stopped standby. Past this the slot is given up instead of filling the disk; the standby
# then catches up from the archive (its restore_command) or is seeded again.
max_slot_wal_keep_size = 1024MB
hot_standby = on

# The log. A slow statement is logged, but never a value: a company's values arrive as parameters, and a parameter is
# never written, neither for a slow statement nor for one that failed. Only a superuser can change these three.
log_min_duration_statement = 1s
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'
timezone = 'UTC'
datestyle = 'iso, mdy'
default_text_search_config = 'pg_catalog.english'

# Per machine, written by the kit's scripts: a standby's upstream (standby.sh seed) and a restore's target
# (restore.sh). Absent on a running primary.
include_if_exists = '/etc/company-data-local/standby.conf'
include_if_exists = '/etc/company-data-local/restore.conf'
