# The company data store's pg_hba.conf (postgresql.conf hba_file). The first line that matches decides; nothing
# else may connect.
# TYPE  DATABASE     USER      ADDRESS   METHOD

# The superuser, only over the container's socket, as the container's own postgres user: the kit's scripts
# (docker compose exec -u postgres) and base backups (base-backup.sh).
local   all          postgres            peer
local   replication  postgres            peer
host    all          postgres  all       reject

# The gateway, by address: it logs in as its own logins and as each database folder's roles, so the rule is the
# network, not the name. samenet is the networks the container is on: on a machine that is its compose network only.
# The database's port is not published there, so nothing outside the machine reaches this line, and replication.yml's
# published port brings the standby's node from an address outside it.
host    all          all       samenet   scram-sha-256

# Replication: the standby's own address, TLS only. `standby.sh allow ADDR` writes this file on the primary's machine.
# ("all" never matches a replication connection, so the line above lets none in.)
include_if_exists /etc/company-data-local/hba-standby.conf
