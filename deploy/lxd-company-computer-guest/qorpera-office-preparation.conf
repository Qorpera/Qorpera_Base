# Install as /usr/lib/tmpfiles.d/qorpera-office-preparation.conf in the pinned image.
# Boot-time setup creates local custody paths. Never truncate an existing lock.
d /etc/qorpera-office 0755 root root -
d /etc/qorpera-office/credentials 0700 root root -
d /etc/qorpera-office/boots 0755 root root -
d /run/qorpera-office-preparation 0700 root root -
f /run/qorpera-office-preparation/control.lock 0600 root root -
