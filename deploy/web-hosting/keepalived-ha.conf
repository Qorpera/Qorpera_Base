vrrp_script chk_qorpera_web_edge {
	script "/usr/bin/curl -fsS --max-time 2 http://127.0.0.1:8094/_internal/health"
	interval 2
	fall 2
	rise 2
}

vrrp_instance QORPERA_WEB_EDGE {
	state MASTER
	interface enp8s0
	virtual_router_id 94
	priority 100
	advert_int 1
	unicast_src_ip 192.168.1.27
	unicast_peer {
		192.168.1.42
	}
	authentication {
		auth_type PASS
		auth_pass REPLACE_WITH_8CHAR_SECRET
	}
	virtual_ipaddress {
		192.168.1.250/24 dev enp8s0
	}
	track_script {
		chk_qorpera_web_edge
	}
}
