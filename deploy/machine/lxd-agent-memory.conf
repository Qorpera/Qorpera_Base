# /etc/systemd/system/lxd-agent.service.d/qorpera-memory.conf. The machine is run through the LXD agent: the executor's
# helper (which starts and reads the agents' commands), the screen helper and a member's look and input all run under
# it and inherit this. When memory runs out they are not what is ended (deploy/machine/machine-memory). An agent's
# command is a unit of its own under systemd and inherits nothing of it.
[Service]
OOMScoreAdjust=-900
